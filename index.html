<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BÁO GIÁ SỬA CHỮA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- FIREBASE COMPAT SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; font-size: 1.15rem; }
        .card-dark { background-color: #111827; border: 1px solid #1f2937; }
        .row-hover:hover { background-color: rgba(31, 41, 55, 0.5); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body class="min-h-screen p-3 md:p-6 uppercase">

    <div class="max-w-7xl mx-auto space-y-4 md:space-y-6">
        <!-- THANH CÔNG CỤ & THỐNG KÊ -->
        <div class="card-dark p-3 md:p-4 rounded-2xl flex flex-col gap-3 shadow-lg">
            <div class="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-3">
                <div class="flex flex-col gap-2.5 w-full">
                    <!-- TABS HÃNG -->
                    <div class="flex flex-wrap items-center gap-1.5 overflow-x-auto pb-1 xl:pb-0" id="brand-tabs"></div>
                    
                    <!-- DÒNG LỌC LINH KIỆN & CÁC NÚT ĐIỀU KHIỂN BÊN PHẢI (Ẩn, Cloud, Vốn) -->
                    <div class="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-3 pt-1 border-t border-gray-800/80">
                        <div class="flex flex-wrap items-center gap-1.5 relative">
                            <span class="text-sm font-bold text-gray-400 uppercase mr-1">LINH KIỆN:</span>
                            <div id="main-cat-tabs" class="flex flex-wrap items-center gap-1.5"></div>
                            
                            <!-- NÚT MŨI TÊN SANG PHẢI (XEM THÊM LINH KIỆN) -->
                            <div class="relative">
                                <button onclick="toggleMoreCats(event)" class="px-3 py-2 rounded-xl text-sm font-bold bg-gray-800 border border-gray-700 hover:bg-gray-700 text-white transition flex items-center justify-center" title="XEM THÊM LINH KIỆN">
                                    <i class="fa-solid fa-chevron-right text-white text-xs"></i>
                                </button>
                                <div id="dropdown-more-cats" class="hidden absolute left-0 mt-2 w-52 bg-gray-900 border border-gray-700 rounded-xl shadow-2xl z-50 p-2 flex flex-col gap-1.5">
                                    <div id="sub-cat-list" class="flex flex-col gap-1"></div>
                                    <div class="border-t border-gray-800 pt-1 mt-1">
                                        <button onclick="handleEntity('categories', 'add')" class="w-full text-left px-3 py-2 rounded-xl text-sm font-semibold text-emerald-400 hover:bg-gray-800 transition flex items-center gap-2">
                                            <i class="fa-solid fa-plus-circle"></i> TẠO MỚI LINH KIỆN
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- CÁC NÚT BÊN PHẢI: ẨN/HIỆN, CLOUD, VỐN -->
                        <div class="hidden xl:flex flex-wrap items-center gap-2 justify-end">
                            <button onclick="togglePrivacyMode()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 p-2 rounded-xl text-sm font-medium border border-gray-700 transition flex items-center justify-center w-10 h-10" title="ẨN / HIỆN VỐN & LÃI">
                                <i class="fa-solid fa-eye text-base" id="privacy-icon"></i>
                            </button>
                            <div id="cloud-status" class="flex w-10 h-10 bg-gray-900 rounded-xl border border-gray-800 items-center justify-center" title="Đang kết nối...">
                                <i class="fa-solid fa-circle-notch fa-spin text-amber-400 text-base"></i>
                            </div>
                            <div class="flex items-center gap-2 bg-gray-900/80 px-3.5 py-1.5 rounded-xl border border-gray-800">
                                <div>
                                    <div class="text-[11px] text-gray-400 uppercase tracking-wider text-center">VỐN</div>
                                    <div id="total-cost" class="text-sm font-bold text-amber-400 text-center">0</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- DÒNG TÌM KIẾM, NÚT KIỂU VÀ NÚT THÊM MỚI BÊN DƯỚI -->
                    <div class="flex items-center justify-between gap-2 pt-1 border-t border-gray-800/80 relative">
                        <div class="flex items-center gap-2 flex-1">
                            <div class="relative w-64 md:w-80">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-500">
                                    <i class="fa-solid fa-magnifying-glass text-xs"></i>
                                </span>
                                <input type="text" id="search-input" oninput="renderTable()" placeholder="TÌM KIẾM..." 
                                    class="w-full pl-9 pr-3 py-2 bg-gray-900 border border-gray-700 rounded-xl text-sm focus:outline-none focus:border-indigo-500 text-white placeholder-gray-500 uppercase">
                            </div>

                            <!-- NÚT LỌC KIỂU -->
                            <div class="relative shrink-0" id="filter-type-container">
                                <button id="btn-type-filter" onclick="toggleTypeFilter(event)" class="px-3.5 py-2 rounded-xl text-sm font-bold bg-gray-900 border border-gray-700 hover:bg-gray-800 text-white transition flex items-center gap-2" title="LỌC KIỂU">
                                    <span id="label-current-type" class="text-red-500 font-bold">KIỂU</span>
                                    <i class="fa-solid fa-chevron-down text-white text-xs transition-transform duration-200" id="type-chevron"></i>
                                </button>
                                <div id="dropdown-types" class="hidden absolute left-0 mt-2 w-44 bg-gray-900 border border-gray-700 rounded-xl shadow-2xl z-50 p-2 flex flex-col gap-1">
                                    <div id="type-menu-list" class="flex flex-col gap-1"></div>
                                </div>
                            </div>
                        </div>

                        <!-- NÚT THÊM MỚI -->
                        <div class="hidden xl:block shrink-0">
                            <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition flex items-center gap-1.5 shadow-lg shadow-indigo-600/35">
                                <i class="fa-solid fa-plus"></i> THÊM MỚI
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- BẢNG DỮ LIỆU -->
        <div class="card-dark rounded-2xl overflow-hidden shadow-xl">
            <!-- BẢNG DESKTOP -->
            <div class="hidden md:block overflow-x-auto">
                <table class="w-full text-center border-collapse">
                    <thead>
                        <tr id="desktop-table-header" class="bg-indigo-600 text-white text-sm uppercase tracking-wider shadow-sm"></tr>
                    </thead>
                    <tbody id="device-table-body" class="divide-y divide-gray-800/60 text-base"></tbody>
                </table>
            </div>

            <!-- DANH SÁCH MOBILE RÚT GỌN (DẠNG HÀNG NGANG CHUẨN GIAO DIỆN GỐC) -->
            <div class="md:hidden divide-y divide-gray-800/60 p-2 space-y-2" id="device-mobile-list"></div>

            <div id="empty-state" class="hidden text-center py-12 text-gray-500">
                <i class="fa-solid fa-box-open text-3xl mb-2"></i>
                <p class="text-sm">KHÔNG TÌM THẤY THIẾT BỊ NÀO PHÙ HỢP.</p>
            </div>
        </div>
    </div>

    <!-- MODAL THÊM / SỬA -->
    <div id="device-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-3 hidden">
        <div class="card-dark w-full max-w-xl rounded-2xl p-5 md:p-7 shadow-2xl border border-gray-700 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modal-title" class="text-base md:text-xl font-bold text-pink-500">THÊM THIẾT BỊ MỚI</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="device-form" onsubmit="saveDevice(event)" class="space-y-3">
                <input type="hidden" id="device-id">

                <div>
                    <label class="block text-sm font-bold text-amber-400 uppercase mb-1">HÃNG</label>
                    <div class="flex items-center gap-2">
                        <input type="text" id="device-brand" required list="brand-suggestions" class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 uppercase">
                        <datalist id="brand-suggestions"></datalist>
                        <div class="flex items-center gap-1">
                            <button type="button" onclick="handleEntity('brands', 'add')" class="p-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg transition text-sm font-bold" title="THÊM HÃNG"><i class="fa-solid fa-plus"></i></button>
                            <button type="button" onclick="handleEntity('brands', 'edit')" class="p-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg transition text-sm font-bold" title="SỬA HÃNG"><i class="fa-solid fa-pen"></i></button>
                            <button type="button" onclick="handleEntity('brands', 'delete')" class="p-2.5 bg-red-600 hover:bg-red-500 text-white rounded-lg transition text-sm font-bold" title="XÓA HÃNG"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-amber-400 uppercase mb-1">TÊN MÁY</label>
                    <div class="flex items-center gap-2">
                        <input type="text" id="device-name" required list="name-suggestions" class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 uppercase">
                        <div class="flex items-center gap-1">
                            <button type="button" onclick="handleEntity('names', 'add')" class="p-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg transition text-sm font-bold" title="THÊM TÊN MÁY"><i class="fa-solid fa-plus"></i></button>
                            <button type="button" onclick="handleEntity('names', 'edit')" class="p-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg transition text-sm font-bold" title="SỬA TÊN MÁY"><i class="fa-solid fa-pen"></i></button>
                            <button type="button" onclick="handleEntity('names', 'delete')" class="p-2.5 bg-red-600 hover:bg-red-500 text-white rounded-lg transition text-sm font-bold" title="XÓA TÊN MÁY"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                    <datalist id="name-suggestions"></datalist>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-bold text-amber-400 uppercase mb-1 text-center">LINH KIỆN</label>
                        <div class="flex items-center gap-2">
                            <input type="text" id="device-part" required list="part-suggestions" class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white text-center focus:outline-none focus:border-indigo-500 uppercase">
                            <datalist id="part-suggestions"></datalist>
                            <div class="flex items-center gap-1">
                                <button type="button" onclick="handleEntity('categories', 'add')" class="p-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg transition text-sm font-bold" title="THÊM"><i class="fa-solid fa-plus"></i></button>
                                <button type="button" onclick="handleEntity('categories', 'edit')" class="p-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg transition text-sm font-bold" title="SỬA"><i class="fa-solid fa-pen"></i></button>
                                <button type="button" onclick="handleEntity('categories', 'delete')" class="p-2.5 bg-red-600 hover:bg-red-500 text-white rounded-lg transition text-sm font-bold" title="XÓA"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-amber-400 uppercase mb-1 text-center">KIỂU</label>
                        <div class="flex items-center gap-2">
                            <input type="text" id="device-type" list="type-suggestions" class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white text-center focus:outline-none focus:border-indigo-500 uppercase">
                            <datalist id="type-suggestions"></datalist>
                            <div class="flex items-center gap-1">
                                <button type="button" onclick="handleEntity('types', 'add')" class="p-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg transition text-sm font-bold" title="THÊM"><i class="fa-solid fa-plus"></i></button>
                                <button type="button" onclick="handleEntity('types', 'edit')" class="p-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg transition text-sm font-bold" title="SỬA"><i class="fa-solid fa-pen"></i></button>
                                <button type="button" onclick="handleEntity('types', 'delete')" class="p-2.5 bg-red-600 hover:bg-red-500 text-white rounded-lg transition text-sm font-bold" title="XÓA"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-sm font-bold text-amber-400 uppercase mb-1 text-center">GIÁ BÁN</label>
                        <input type="text" id="device-price" required maxlength="6" oninput="formatCurrencyInput(this)" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white text-center focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-amber-400 uppercase mb-1 text-center">GIÁ NHẬP</label>
                        <input type="text" id="device-cost" required maxlength="6" oninput="formatCurrencyInput(this)" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white text-center focus:outline-none focus:border-indigo-500">
                    </div>
                </div>

                <div class="flex items-end gap-2 pt-1">
                    <div class="flex flex-col items-center">
                        <label class="block text-sm font-bold text-amber-400 uppercase mb-1 text-center w-full">SL</label>
                        <div class="flex items-center bg-gray-900 border border-gray-700 rounded-xl overflow-hidden p-0.5">
                            <button type="button" onclick="adjustQty(-1)" class="w-9 h-9 bg-gray-800 text-white font-bold transition flex items-center justify-center rounded-lg"><i class="fa-solid fa-minus text-xs"></i></button>
                            <input type="number" id="device-qty" required value="1" min="0" oninput="updateModalStats()" class="w-12 bg-transparent text-sm font-bold text-white text-center focus:outline-none">
                            <button type="button" onclick="adjustQty(1)" class="w-9 h-9 bg-gray-800 text-white font-bold transition flex items-center justify-center rounded-lg"><i class="fa-solid fa-plus text-xs"></i></button>
                        </div>
                    </div>

                    <div class="flex flex-col items-center">
                        <label class="block text-sm font-bold text-amber-400 uppercase mb-1 text-center w-full">MÀU</label>
                        <input type="text" id="device-color" list="color-suggestions" placeholder="ĐEN / TRẮNG" class="w-28 bg-gray-900 border border-gray-700 rounded-xl px-2 py-2 text-sm text-white text-center focus:outline-none focus:border-indigo-500 uppercase">
                        <datalist id="color-suggestions">
                            <option value="ĐEN">
                            <option value="TRẮNG">
                        </datalist>
                    </div>

                    <div class="flex-1 flex flex-col items-center min-w-0">
                        <label class="block text-sm font-bold text-amber-400 uppercase mb-1 text-center w-full">LÃI</label>
                        <div class="w-full bg-gray-900/90 border border-gray-800 px-2 rounded-xl h-10 flex items-center justify-center">
                            <div id="modal-profit-preview" class="text-sm font-bold text-emerald-400 leading-none truncate text-center w-full">0</div>
                        </div>
                    </div>

                    <div class="flex items-center gap-1.5 shrink-0">
                        <button type="button" onclick="closeModal()" class="px-4 h-10 rounded-xl text-sm font-semibold bg-gray-800 text-gray-300 hover:bg-gray-700 transition">HỦY</button>
                        <button type="submit" class="px-4 h-10 rounded-xl text-sm font-semibold bg-indigo-600 text-white hover:bg-indigo-500 transition shadow-lg shadow-indigo-600/35 whitespace-nowrap">LƯU</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBLC4dPLEP84yj6vkvf--DM8u_dN9YPJEs",
            authDomain: "bao-gia-sua-chua.firebaseapp.com",
            projectId: "bao-gia-sua-chua",
            storageBucket: "bao-gia-sua-chua.firebasestorage.app",
            messagingSenderId: "775400571262",
            appId: "1:775400571262:web:b264070746f5fbb6fbf32f"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let devices = [
            { id: 1, brand: 'IPHONE', part: 'MÀN HÌNH', type: 'ZIN', name: '14 PRO MAX', price: 1200, cost: 800, qty: 5, color: 'ĐEN' },
            { id: 2, brand: 'IPHONE', part: 'MÀN HÌNH', type: 'GX', name: '12 PRO MAX', price: 1400, cost: 950, qty: 2, color: 'TRẮNG' },
            { id: 3, brand: 'SAMSUNG', part: 'PIN', type: 'ZIN HÃNG', name: 'S22 ULTRA - S23 ULTRA', price: 650, cost: 420, qty: 8, color: '' },
            { id: 4, brand: 'OPPO - REALME', part: 'KÍNH - C.ỨNG', type: 'ZIN', name: 'A17 - A57 - A18 - A58 - C1 - C12 - A54', price: 950, cost: 700, qty: 3, color: 'ĐEN' }
        ];
        let brands = ['IPHONE', 'SAMSUNG', 'OPPO - REALME', 'MI - POCO', 'VIVO', 'KHÁC'];
        let categories = ['MÀN HÌNH', 'PIN', 'KÍNH - C.ỨNG', 'CÁP/BO SẠC'];
        let types = ['ZIN', 'GX', 'ZIN BÓC MÁY', 'ZIN HÃNG', 'OLED', 'LINH KIỆN'];
        let names = ['14 PRO MAX', '12 PRO MAX', 'S22 ULTRA - S23 ULTRA', 'A17 - A57 - A18 - A58 - C1 - C12 - A54'];

        let currentBrand = brands[0] || '', currentCategory = categories[0] || '', currentType = '', isPrivacyMode = false;

        function getShortCategory(partName) {
            if (!partName) return '';
            const upper = partName.toUpperCase();
            if (upper.includes('MÀN HÌNH')) return 'MÀN HÌNH';
            return partName;
        }

        // Hàm dựng tên máy: Đỏ - Trắng xen kẽ
        function renderDeviceNames(nameStr, isMobile = false) {
            if (!nameStr) return '';
            const parts = nameStr.split('-').map(p => p.trim()).filter(Boolean);

            if (isMobile) {
                // Hiển thị tên máy dạng nút bo góc trên Mobile
                return parts.map((part, index) => {
                    const textColor = (index % 2 === 0) ? 'text-amber-400' : 'text-white';
                    return `<span class="px-2.5 py-1.5 rounded-xl bg-gray-900 border border-gray-800 ${textColor} font-bold text-sm inline-flex items-center gap-1.5">${part}</span>`;
                }).join(' ');
            }

            // Hiển thị dạng ô trên Desktop
            return parts.map((part, index) => {
                const textColor = (index % 2 === 0) ? 'text-red-500' : 'text-white';
                return `<span class="px-1 py-0 rounded bg-gray-800/90 border border-gray-700/60 ${textColor} font-extrabold whitespace-nowrap text-xl inline-block m-0.5">${part}</span>`;
            }).join('');
        }

        function syncFromCloud() {
            const statusEl = document.getElementById('cloud-status');
            if(statusEl) {
                statusEl.setAttribute('title', 'Đang đồng bộ...');
                statusEl.innerHTML = `<i class="fa-solid fa-cloud-arrow-up text-emerald-400 text-sm"></i>`;
            }

            db.collection("store_data").doc("main").onSnapshot((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    if (data.devices) devices = data.devices;
                    if (data.brands) brands = data.brands;
                    if (data.categories) categories = data.categories;
                    if (data.types) types = data.types;
                    if (data.names) names = data.names;
                } else {
                    saveAllToCloud();
                }
                if(statusEl) {
                    statusEl.setAttribute('title', 'Online Realtime');
                    statusEl.innerHTML = `<i class="fa-solid fa-cloud text-emerald-400 text-sm"></i>`;
                }
                if (!currentBrand && brands.length) currentBrand = brands[0];
                if (!currentCategory && categories.length) currentCategory = categories[0];
                initTabs();
                renderTable();
            }, (err) => {
                console.error("Lỗi Firestore:", err);
                if(statusEl) {
                    statusEl.setAttribute('title', 'Lỗi quyền Firebase');
                    statusEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-red-400 text-sm"></i>`;
                }
            });
        }

        async function saveAllToCloud() {
            try {
                await db.collection("store_data").doc("main").set({
                    devices, brands, categories, types, names
                });
            } catch (e) {
                console.error("Lỗi lưu Cloud:", e);
            }
        }

        function initTabs() {
            document.getElementById('brand-tabs').innerHTML = brands.map(b => 
                `<button onclick="currentBrand='${b}'; initTabs(); renderTable();" class="px-3.5 py-2 rounded-xl text-sm font-semibold transition uppercase ${b === currentBrand ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/35' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'}">${b === 'KHÁC' ? 'HÃNG KHÁC' : b}</button>`
            ).join('');

            const fixedMainCats = ['MÀN HÌNH', 'PIN'];
            const catHtml = fixedMainCats.map(c => 
                `<button onclick="currentCategory='${c}'; initTabs(); renderTable();" class="px-3.5 py-2 rounded-xl text-sm font-semibold transition uppercase ${c === currentCategory ? 'bg-indigo-500/20 text-indigo-400 border border-indigo-500/30' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'}">${c}</button>`
            ).join('');

            document.getElementById('main-cat-tabs').innerHTML = catHtml;

            const subCats = categories.filter(c => !fixedMainCats.includes(c));
            const subCatHtml = subCats.length ? subCats.map(c => 
                `<button onclick="currentCategory='${c}'; initTabs(); renderTable(); toggleMoreCats(event);" class="w-full text-left px-3.5 py-2 rounded-xl text-sm font-semibold transition uppercase ${c === currentCategory ? 'bg-indigo-500/20 text-indigo-400' : 'text-gray-300 hover:bg-gray-800'}">${c}</button>`
            ).join('') : '<div class="px-3 py-1 text-sm text-gray-500 italic">Chưa có mục khác</div>';

            document.getElementById('sub-cat-list').innerHTML = subCatHtml;

            const isIphone = currentBrand.toUpperCase() === 'IPHONE';
            const filterTypeContainer = document.getElementById('filter-type-container');
            if (filterTypeContainer) {
                filterTypeContainer.style.display = isIphone ? 'block' : 'none';
            }
            if (!isIphone) currentType = '';

            const lblType = document.getElementById('label-current-type');
            if (lblType) {
                if (currentType) {
                    lblType.innerText = currentType;
                    lblType.className = "text-amber-400 font-bold";
                } else {
                    lblType.innerText = "KIỂU";
                    lblType.className = "text-red-500 font-bold";
                }
            }

            const allTypeOption = `<button onclick="selectType('');" class="w-full text-left px-3.5 py-2 rounded-xl text-sm font-semibold transition uppercase ${currentType === '' ? 'bg-indigo-500/20 text-indigo-400' : 'text-gray-300 hover:bg-gray-800'}">-- TẤT CẢ --</button>`;
            const typeOptions = types.map(t => 
                `<button onclick="selectType('${t}');" class="w-full text-left px-3.5 py-2 rounded-xl text-sm font-semibold transition uppercase ${t === currentType ? 'bg-amber-400/20 text-amber-400' : 'text-gray-300 hover:bg-gray-800'}">${t}</button>`
            ).join('');
            
            document.getElementById('type-menu-list').innerHTML = allTypeOption + typeOptions;

            document.getElementById('brand-suggestions').innerHTML = brands.map(b => `<option value="${b}">`).join('');
            document.getElementById('part-suggestions').innerHTML = categories.map(c => `<option value="${c}">`).join('');
            document.getElementById('type-suggestions').innerHTML = types.map(t => `<option value="${t}">`).join('');
            document.getElementById('name-suggestions').innerHTML = names.map(n => `<option value="${n}">`).join('');
        }

        function toggleTypeFilter(e) {
            e.stopPropagation();
            document.getElementById('dropdown-more-cats')?.classList.add('hidden');
            document.getElementById('dropdown-types').classList.toggle('hidden');
        }

        function selectType(t) {
            currentType = t;
            document.getElementById('dropdown-types').classList.add('hidden');
            initTabs();
            renderTable();
        }

        function toggleMoreCats(e) { 
            e.stopPropagation(); 
            document.getElementById('dropdown-types')?.classList.add('hidden');
            document.getElementById('dropdown-more-cats').classList.toggle('hidden'); 
        }

        window.onclick = () => {
            document.getElementById('dropdown-more-cats')?.classList.add('hidden');
            document.getElementById('dropdown-types')?.classList.add('hidden');
        };

        function adjustQty(val) {
            const input = document.getElementById('device-qty');
            input.value = Math.max(0, (Number(input.value) || 0) + val);
            updateModalStats();
        }

        const parseNum = str => Number(String(str).replace(/\D/g, '')) || 0;
        const fmtVal = val => Number(val).toLocaleString('vi-VN');
        const fmtSecret = val => isPrivacyMode ? '***' : fmtVal(val);

        function formatCurrencyInput(input) {
            let digits = String(input.value).replace(/\D/g, '').slice(0, 5);
            input.value = digits ? Number(digits).toLocaleString('vi-VN') : '';
            updateModalStats();
        }

        function updateModalStats() {
            const p = parseNum(document.getElementById('device-price').value);
            const c = parseNum(document.getElementById('device-cost').value);
            document.getElementById('modal-profit-preview').innerText = fmtVal(p - c);
        }

        function openModal() {
            document.getElementById('modal-title').innerText = "THÊM THIẾT BỊ MỚI";
            document.getElementById('device-id').value = '';
            document.getElementById('device-form').reset();
            document.getElementById('device-qty').value = '1';
            document.getElementById('device-color').value = '';
            document.getElementById('device-brand').value = currentBrand;
            document.getElementById('device-part').value = currentCategory;
            document.getElementById('device-modal').classList.remove('hidden');
            updateModalStats();
        }

        function closeModal() {
            document.getElementById('device-modal').classList.add('hidden');
        }

        function editDevice(id) {
            const item = devices.find(d => d.id === id);
            if (!item) return;
            document.getElementById('modal-title').innerText = "CHỈNH SỬA THIẾT BỊ";
            document.getElementById('device-id').value = item.id;
            document.getElementById('device-brand').value = item.brand;
            document.getElementById('device-name').value = item.name;
            document.getElementById('device-part').value = item.part;
            document.getElementById('device-type').value = item.type;
            document.getElementById('device-price').value = fmtVal(item.price);
            document.getElementById('device-cost').value = fmtVal(item.cost);
            document.getElementById('device-qty').value = item.qty;
            document.getElementById('device-color').value = item.color || '';
            document.getElementById('device-modal').classList.remove('hidden');
            updateModalStats();
        }

        function cloneDevice(id) {
            const item = devices.find(d => d.id === id);
            if (!item) return;
            document.getElementById('modal-title').innerText = "NHÂN BẢN THIẾT BỊ MỚI";
            document.getElementById('device-id').value = '';
            document.getElementById('device-brand').value = item.brand;
            document.getElementById('device-name').value = item.name;
            document.getElementById('device-part').value = item.part;
            document.getElementById('device-type').value = item.type;
            document.getElementById('device-price').value = fmtVal(item.price);
            document.getElementById('device-cost').value = fmtVal(item.cost);
            document.getElementById('device-qty').value = item.qty;
            document.getElementById('device-color').value = item.color || '';
            document.getElementById('device-modal').classList.remove('hidden');
            updateModalStats();
        }

        function saveDevice(e) {
            e.preventDefault();
            const id = document.getElementById('device-id').value;
            const brand = document.getElementById('device-brand').value.trim().toUpperCase();
            const name = document.getElementById('device-name').value.trim().toUpperCase();
            const part = document.getElementById('device-part').value.trim().toUpperCase();
            const type = document.getElementById('device-type').value.trim().toUpperCase();
            const color = document.getElementById('device-color').value.trim().toUpperCase();
            const price = parseNum(document.getElementById('device-price').value);
            const cost = parseNum(document.getElementById('device-cost').value);
            const qty = Number(document.getElementById('device-qty').value) || 0;

            if (!brands.includes(brand)) { brands.push(brand); }
            if (!categories.includes(part)) { categories.push(part); }
            if (type && !types.includes(type)) { types.push(type); }
            if (name && !names.includes(name)) { names.push(name); }

            if (id) {
                const index = devices.findIndex(d => d.id === Number(id));
                if (index !== -1) {
                    devices[index] = { id: Number(id), brand, name, part, type, price, cost, qty, color };
                }
            } else {
                const newId = devices.length > 0 ? Math.max(...devices.map(d => d.id)) + 1 : 1;
                devices.push({ id: newId, brand, name, part, type, price, cost, qty, color });
            }

            currentBrand = brand;
            currentCategory = part;
            saveAllToCloud();
            closeModal();
            initTabs();
            renderTable();
        }

        function deleteDevice(id) {
            if (confirm("XÓA BẠN CÓ CHẮC CHẮN MUỐN XÓA THIẾT BỊ NÀY KHÔNG?")) {
                devices = devices.filter(d => d.id !== id);
                saveAllToCloud();
                renderTable();
            }
        }

        function handleEntity(entityType, action) {
            let list = entityType === 'brands' ? brands : entityType === 'categories' ? categories : entityType === 'types' ? types : names;
            let currentVal = entityType === 'brands' ? document.getElementById('device-brand').value.trim().toUpperCase() :
                             entityType === 'categories' ? document.getElementById('device-part').value.trim().toUpperCase() :
                             entityType === 'types' ? document.getElementById('device-type').value.trim().toUpperCase() :
                             document.getElementById('device-name').value.trim().toUpperCase();

            if (action === 'add') {
                let newVal = prompt("NHẬP GIÁ TRỊ MỚI:").trim().toUpperCase();
                if (newVal && !list.includes(newVal)) {
                    list.push(newVal);
                    saveAllToCloud();
                    initTabs();
                }
            } else if (action === 'edit') {
                let oldVal = currentVal || prompt("NHẬP GIÁ TRỊ CẦN SỬA:");
                if (!oldVal || !list.includes(oldVal)) { alert("KHÔNG TÌM THẤY GIÁ TRỊ!"); return; }
                let newVal = prompt("NHẬP GIÁ TRỊ MỚI THẾ CHO '" + oldVal + "':").trim().toUpperCase();
                if (newVal) {
                    let idx = list.indexOf(oldVal);
                    if (idx !== -1) list[idx] = newVal;
                    devices.forEach(d => {
                        if (entityType === 'brands' && d.brand === oldVal) d.brand = newVal;
                        if (entityType === 'categories' && d.part === oldVal) d.part = newVal;
                        if (entityType === 'types' && d.type === oldVal) d.type = newVal;
                        if (entityType === 'names' && d.name === oldVal) d.name = newVal;
                    });
                    saveAllToCloud();
                    initTabs();
                    renderTable();
                }
            } else if (action === 'delete') {
                let valToDelete = currentVal || prompt("NHẬP GIÁ TRỊ CẦN XÓA:");
                if (valToDelete && confirm("XÓA BẠN CÓ CHẮC MUỐN XÓA '" + valToDelete + "' KHÔNG?")) {
                    if (entityType === 'brands' && brands.length <= 1) { alert("CẦN ÍT NHẤT MỘT HÃNG!"); return; }
                    if (entityType === 'categories' && categories.length <= 1) { alert("CẦN ÍT NHẤT MỘT LINH KIỆN!"); return; }
                    
                    if (entityType === 'brands') brands = brands.filter(b => b !== valToDelete);
                    if (entityType === 'categories') categories = categories.filter(c => c !== valToDelete);
                    if (entityType === 'types') types = types.filter(t => t !== valToDelete);
                    if (entityType === 'names') names = names.filter(n => n !== valToDelete);

                    saveAllToCloud();
                    initTabs();
                    renderTable();
                }
            }
        }

        function togglePrivacyMode() {
            isPrivacyMode = !isPrivacyMode;
            const icon = document.getElementById('privacy-icon');
            if (icon) {
                icon.className = isPrivacyMode ? "fa-solid fa-eye-slash text-base text-pink-500" : "fa-solid fa-eye text-base";
            }
            renderTable();
        }

        function renderTable() {
            const searchVal = document.getElementById('search-input').value.trim().toUpperCase();
            
            let filtered = devices.filter(d => {
                const matchBrand = d.brand === currentBrand;
                const matchCategory = d.part === currentCategory;
                const matchType = !currentType || d.type === currentType;
                
                const matchSearch = !searchVal || 
                    d.name.includes(searchVal) || 
                    d.part.includes(searchVal) || 
                    (d.type && d.type.includes(searchVal)) ||
                    (d.color && d.color.includes(searchVal));

                return matchBrand && matchCategory && matchType && matchSearch;
            });

            const isIphone = currentBrand.toUpperCase() === 'IPHONE';

            let headers = `
                <th class="py-3 px-2 w-12">STT</th>
                <th class="py-3 px-4 text-left">TÊN MÁY</th>
                <th class="py-3 px-3">LINH KIỆN</th>
                ${isIphone ? '<th class="py-3 px-3">KIỂU</th>' : ''}
                <th class="py-3 px-3">MÀU</th>
                <th class="py-3 px-3">GIÁ BÁN</th>
                <th class="py-3 px-3">GIÁ VỐN</th>
                <th class="py-3 px-3">LÃI</th>
                <th class="py-3 px-2 w-16">SL</th>
                <th class="py-3 px-3 w-32">THƯ VIỆN</th>
            `;
            document.getElementById('desktop-table-header').innerHTML = headers;

            let totalCostSum = 0;
            devices.forEach(d => { totalCostSum += (d.cost * (d.qty || 1)); });
            document.getElementById('total-cost').innerText = isPrivacyMode ? '***' : fmtVal(totalCostSum);

            const tbody = document.getElementById('device-table-body');
            const mobileList = document.getElementById('device-mobile-list');
            const emptyState = document.getElementById('empty-state');

            if (filtered.length === 0) {
                tbody.innerHTML = '';
                mobileList.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            let desktopHtml = '';
            let mobileHtml = '';

            filtered.forEach((item, index) => {
                const profit = item.price - item.cost;
                const shortPart = getShortCategory(item.part);
                const deviceNamesHtml = renderDeviceNames(item.name, false);
                const deviceNamesMobileHtml = renderDeviceNames(item.name, true);

                // Biểu tượng màu tròn chuẩn giao diện gốc
                let colorDot = '';
                if (item.color) {
                    const isWhite = item.color.toUpperCase().includes('TRẮNG');
                    colorDot = `<span class="w-3.5 h-3.5 rounded-full inline-block border border-gray-600 ${isWhite ? 'bg-white' : 'bg-black'}"></span>`;
                }

                desktopHtml += `
                    <tr class="row-hover transition">
                        <td class="py-3 px-2 text-gray-400 font-medium">${index + 1}</td>
                        <td class="py-3 px-4 text-left font-bold text-white">${deviceNamesHtml}</td>
                        <td class="py-3 px-3 text-amber-400 font-semibold">${shortPart}</td>
                        ${isIphone ? `<td class="py-3 px-3 text-cyan-400 font-semibold">${item.type || '-'}</td>` : ''}
                        <td class="py-3 px-3 text-gray-300 font-medium">${item.color || '-'}</td>
                        <td class="py-3 px-3 text-emerald-400 font-bold">${fmtVal(item.price)}</td>
                        <td class="py-3 px-3 text-amber-400 font-semibold">${fmtSecret(item.cost)}</td>
                        <td class="py-3 px-3 text-pink-500 font-bold">${fmtSecret(profit)}</td>
                        <td class="py-3 px-2 font-bold text-indigo-400">${item.qty}</td>
                        <td class="py-3 px-3">
                            <div class="flex items-center justify-center gap-1.5">
                                <button onclick="cloneDevice(${item.id})" class="p-1.5 bg-gray-800 hover:bg-gray-700 text-indigo-400 rounded-lg transition" title="NHÂN BẢN"><i class="fa-solid fa-copy text-xs"></i></button>
                                <button onclick="editDevice(${item.id})" class="p-1.5 bg-gray-800 hover:bg-gray-700 text-blue-400 rounded-lg transition" title="SỬA"><i class="fa-solid fa-pen text-xs"></i></button>
                                <button onclick="deleteDevice(${item.id})" class="p-1.5 bg-gray-800 hover:bg-gray-700 text-red-400 rounded-lg transition" title="XÓA"><i class="fa-solid fa-trash text-xs"></i></button>
                            </div>
                        </td>
                    </tr>
                `;

                // GIAO DIỆN MOBILE CHUẨN HÀNG NGANG
                mobileHtml += `
                    <div class="p-3 bg-gray-900/60 rounded-2xl border border-gray-800 flex items-center justify-between gap-2">
                        <div class="flex items-center gap-2">
                            ${deviceNamesMobileHtml}
                            ${colorDot}
                        </div>
                        <div class="text-sm font-bold text-gray-300 uppercase">${shortPart}</div>
                        <div class="text-sm font-bold text-emerald-400 uppercase">${item.type || ''}</div>
                        <div class="text-base font-extrabold text-red-500">${fmtVal(item.price)}</div>
                    </div>
                `;
            });

            tbody.innerHTML = desktopHtml;
            mobileList.innerHTML = mobileHtml;
        }

        // KHỞI ĐỘNG ỨNG DỤNG
        syncFromCloud();
    </script>
</body>
</html>
