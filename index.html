<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BÁO GIÁ SỬA CHỮA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- FIREBASE COMPAT SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
        .card-dark { background-color: #111827; border: 1px solid #1f2937; }
        .row-hover:hover { background-color: rgba(31, 41, 55, 0.5); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body class="min-h-screen p-3 md:p-8 uppercase">

    <div class="max-w-7xl mx-auto space-y-4 md:space-y-6">
        <!-- THANH CÔNG CỤ & THỐNG KÊ -->
        <div class="card-dark p-3 md:p-4 rounded-2xl flex flex-col gap-3 shadow-lg">
            <div class="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-3">
                <div class="flex flex-col gap-2 w-full xl:w-auto">
                    <!-- TABS HÃNG -->
                    <div class="flex flex-wrap items-center gap-1.5 overflow-x-auto pb-1 xl:pb-0" id="brand-tabs"></div>
                    
                    <!-- DÒNG LỌC LINH KIỆN & DROPDOWN KIỂU -->
                    <div class="flex flex-wrap items-center gap-1.5 pt-1 border-t border-gray-800/80 relative">
                        <span class="text-[11px] font-bold text-gray-400 uppercase mr-1">LINH KIỆN:</span>
                        <div id="main-cat-tabs" class="flex flex-wrap items-center gap-1.5"></div>
                        
                        <!-- NÚT MŨI TÊN SANG PHẢI (XEM THÊM LINH KIỆN) -->
                        <div class="relative">
                            <button onclick="toggleMoreCats(event)" class="px-2.5 py-1.5 rounded-lg text-xs font-bold bg-gray-800 border border-gray-700 hover:bg-gray-700 text-white transition flex items-center justify-center" title="XEM THÊM LINH KIỆN">
                                <i class="fa-solid fa-chevron-right text-white text-xs"></i>
                            </button>
                            <div id="dropdown-more-cats" class="hidden absolute left-0 mt-2 w-48 bg-gray-900 border border-gray-700 rounded-xl shadow-2xl z-50 p-2 flex flex-col gap-1.5">
                                <div id="sub-cat-list" class="flex flex-col gap-1"></div>
                                <div class="border-t border-gray-800 pt-1 mt-1">
                                    <button onclick="handleEntity('categories', 'add')" class="w-full text-left px-3 py-2 rounded-lg text-xs font-semibold text-emerald-400 hover:bg-gray-800 transition flex items-center gap-2">
                                        <i class="fa-solid fa-plus-circle"></i> TẠO MỚI LINH KIỆN
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- NÚT LỌC KIỂU -->
                        <div class="relative">
                            <button id="btn-type-filter" onclick="toggleTypeFilter(event)" class="px-2.5 py-1.5 rounded-lg text-xs font-bold bg-gray-800 border border-gray-700 hover:bg-gray-700 text-white transition flex items-center gap-1.5" title="LỌC KIỂU">
                                <span id="label-current-type" class="text-red-500 font-bold">KIỂU</span>
                                <i class="fa-solid fa-chevron-down text-white text-xs transition-transform duration-200" id="type-chevron"></i>
                            </button>
                            <div id="dropdown-types" class="hidden absolute left-0 mt-2 w-44 bg-gray-900 border border-gray-700 rounded-xl shadow-2xl z-50 p-2 flex flex-col gap-1">
                                <div id="type-menu-list" class="flex flex-col gap-1"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex flex-wrap items-center gap-2 w-full xl:w-auto justify-between xl:justify-end">
                    <!-- BIỂU TƯỢNG ĐÁM MÂY XANH ĐỒNG BỘ ONLINE -->
                    <div id="cloud-status" class="w-9 h-9 bg-gray-900 rounded-xl border border-gray-800 flex items-center justify-center" title="Đang kết nối...">
                        <i class="fa-solid fa-circle-notch fa-spin text-amber-400 text-sm"></i>
                    </div>

                    <div class="relative flex-1 sm:w-56">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-500">
                            <i class="fa-solid fa-magnifying-glass text-xs"></i>
                        </span>
                        <input type="text" id="search-input" oninput="renderTable()" placeholder="TÌM KIẾM..." 
                            class="w-full pl-9 pr-3 py-2 bg-gray-900 border border-gray-700 rounded-xl text-xs focus:outline-none focus:border-indigo-500 text-white placeholder-gray-500 uppercase">
                    </div>
                    
                    <!-- NÚT THÊM MỚI: ẨN TRÊN MOBILE (HIỆN TỪ MÀN HÌNH MD TRỞ LÊN) -->
                    <button onclick="openModal()" class="hidden md:flex bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded-xl text-xs font-medium transition items-center gap-1.5 whitespace-nowrap shadow-lg shadow-indigo-600/30">
                        <i class="fa-solid fa-plus"></i> THÊM MỚI
                    </button>

                    <!-- VỐN & THỐNG KÊ: ẨN TRÊN MOBILE (HIỆN TỪ MÀN HÌNH MD TRỞ LÊN) -->
                    <div class="hidden md:flex items-center gap-2 bg-gray-900/80 px-3 py-1.5 rounded-xl border border-gray-800">
                        <div>
                            <div class="text-[9px] text-gray-400 uppercase tracking-wider text-center">VỐN</div>
                            <div id="total-cost" class="text-xs font-bold text-amber-400 text-center">0</div>
                        </div>
                    </div>

                    <!-- NÚT ẨN/HIỆN: ẨN TRÊN MOBILE (HIỆN TỪ MÀN HÌNH MD TRỞ LÊN) -->
                    <button onclick="togglePrivacyMode()" class="hidden md:flex bg-gray-800 hover:bg-gray-700 text-gray-300 p-2 rounded-xl text-xs font-medium border border-gray-700 transition items-center justify-center w-9 h-9" title="ẨN / HIỆN VỐN & LÃI">
                        <i class="fa-solid fa-eye text-sm" id="privacy-icon"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- BẢNG DỮ LIỆU -->
        <div class="card-dark rounded-2xl overflow-hidden shadow-xl">
            <!-- Giao diện Bảng cho màn hình lớn (MD trở lên) -->
            <div class="hidden md:block overflow-x-auto">
                <table class="w-full text-center border-collapse">
                    <thead>
                        <tr class="bg-indigo-600 text-white text-xs uppercase tracking-wider shadow-sm">
                            <th class="py-3 px-4 font-bold text-center">HÃNG</th>
                            <th class="py-3 px-4 font-bold text-center">TÊN MÁY</th>
                            <th class="py-3 px-4 font-bold text-center">LINH KIỆN</th>
                            <th class="py-3 px-3 font-bold text-center">KIỂU</th>
                            <th class="py-3 px-4 font-bold text-center">GIÁ BÁN</th>
                            <th class="py-3 px-4 font-bold text-center">GIÁ NHẬP</th>
                            <th class="py-3 px-3 font-bold text-center">SL</th>
                            <th class="py-3 px-4 font-bold text-center">THAO TÁC</th>
                            <th class="py-3 px-4 font-bold text-center">LÃI</th>
                        </tr>
                    </thead>
                    <tbody id="device-table-body" class="divide-y divide-gray-800/60 text-sm"></tbody>
                </table>
            </div>

            <!-- Giao diện Danh sách Card cho Mobile -->
            <div class="md:hidden divide-y divide-gray-800/60" id="device-mobile-list"></div>

            <div id="empty-state" class="hidden text-center py-12 text-gray-500">
                <i class="fa-solid fa-box-open text-3xl mb-2"></i>
                <p class="text-xs">KHÔNG TÌM THẤY THIẾT BỊ NÀO PHÙ HỢP.</p>
            </div>
        </div>
    </div>

    <!-- MODAL THÊM / SỬA -->
    <div id="device-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-3 hidden">
        <div class="card-dark w-full max-w-xl rounded-2xl p-4 md:p-6 shadow-2xl border border-gray-700 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modal-title" class="text-sm md:text-lg font-bold text-white">THÊM THIẾT BỊ MỚI</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <form id="device-form" onsubmit="saveDevice(event)" class="space-y-3">
                <input type="hidden" id="device-id">

                <div>
                    <label class="block text-[11px] font-semibold text-gray-400 uppercase mb-1">HÃNG</label>
                    <div class="flex items-center gap-2">
                        <input type="text" id="device-brand" required list="brand-suggestions" class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-xs md:text-sm text-white focus:outline-none focus:border-indigo-500 uppercase">
                        <datalist id="brand-suggestions"></datalist>
                        <div class="flex items-center gap-1">
                            <button type="button" onclick="handleEntity('brands', 'add')" class="p-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg transition text-xs font-bold" title="THÊM HÃNG"><i class="fa-solid fa-plus"></i></button>
                            <button type="button" onclick="handleEntity('brands', 'edit')" class="p-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg transition text-xs font-bold" title="SỬA HÃNG"><i class="fa-solid fa-pen"></i></button>
                            <button type="button" onclick="handleEntity('brands', 'delete')" class="p-2 bg-red-600 hover:bg-red-500 text-white rounded-lg transition text-xs font-bold" title="XÓA HÃNG"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-gray-400 uppercase mb-1">TÊN MÁY</label>
                    <div class="flex items-center gap-2">
                        <input type="text" id="device-name" required list="name-suggestions" class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-xs md:text-sm text-white focus:outline-none focus:border-indigo-500 uppercase">
                        <div class="flex items-center gap-1">
                            <button type="button" onclick="handleEntity('names', 'add')" class="p-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg transition text-xs font-bold" title="THÊM TÊN MÁY"><i class="fa-solid fa-plus"></i></button>
                            <button type="button" onclick="handleEntity('names', 'edit')" class="p-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg transition text-xs font-bold" title="SỬA TÊN MÁY"><i class="fa-solid fa-pen"></i></button>
                            <button type="button" onclick="handleEntity('names', 'delete')" class="p-2 bg-red-600 hover:bg-red-500 text-white rounded-lg transition text-xs font-bold" title="XÓA TÊN MÁY"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                    <datalist id="name-suggestions"></datalist>
                </div>

                <!-- DÒNG LINH KIỆN VÀ KIỂU -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="block text-[11px] font-semibold text-gray-400 uppercase">LINH KIỆN</label>
                            <div class="flex items-center gap-1.5">
                                <button type="button" onclick="handleEntity('categories', 'add')" class="text-emerald-400 text-xs hover:text-emerald-300 transition" title="THÊM"><i class="fa-solid fa-plus"></i></button>
                                <button type="button" onclick="handleEntity('categories', 'edit')" class="text-blue-400 text-xs hover:text-blue-300 transition" title="SỬA"><i class="fa-solid fa-pen"></i></button>
                                <button type="button" onclick="handleEntity('categories', 'delete')" class="text-red-400 text-xs hover:text-red-300 transition" title="XÓA"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                        <input type="text" id="device-part" required list="part-suggestions" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white text-center focus:outline-none focus:border-indigo-500 uppercase">
                        <datalist id="part-suggestions"></datalist>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="block text-[11px] font-semibold text-gray-400 uppercase">KIỂU</label>
                            <div class="flex items-center gap-1.5">
                                <button type="button" onclick="handleEntity('types', 'add')" class="text-emerald-400 text-xs hover:text-emerald-300 transition" title="THÊM"><i class="fa-solid fa-plus"></i></button>
                                <button type="button" onclick="handleEntity('types', 'edit')" class="text-blue-400 text-xs hover:text-blue-300 transition" title="SỬA"><i class="fa-solid fa-pen"></i></button>
                                <button type="button" onclick="handleEntity('types', 'delete')" class="text-red-400 text-xs hover:text-red-300 transition" title="XÓA"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                        <input type="text" id="device-type" list="type-suggestions" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white text-center focus:outline-none focus:border-indigo-500 uppercase">
                        <datalist id="type-suggestions"></datalist>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-400 uppercase mb-1 text-center">GIÁ BÁN</label>
                        <input type="text" id="device-price" required maxlength="6" oninput="formatCurrencyInput(this)" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-2 py-2 text-xs text-white text-center focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-400 uppercase mb-1 text-center">GIÁ NHẬP</label>
                        <input type="text" id="device-cost" required maxlength="6" oninput="formatCurrencyInput(this)" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-2 py-2 text-xs text-white text-center focus:outline-none focus:border-indigo-500">
                    </div>
                </div>

                <div class="flex items-end gap-2 pt-1">
                    <div class="flex flex-col items-center">
                        <label class="block text-[11px] font-semibold text-gray-400 uppercase mb-1 text-center w-full">SL</label>
                        <div class="flex items-center bg-gray-900 border border-gray-700 rounded-xl overflow-hidden p-0.5">
                            <button type="button" onclick="adjustQty(-1)" class="w-8 h-8 bg-gray-800 text-white font-bold transition flex items-center justify-center rounded-lg"><i class="fa-solid fa-minus text-[10px]"></i></button>
                            <input type="number" id="device-qty" required value="1" min="0" oninput="updateModalStats()" class="w-10 bg-transparent text-xs font-bold text-white text-center focus:outline-none">
                            <button type="button" onclick="adjustQty(1)" class="w-8 h-8 bg-gray-800 text-white font-bold transition flex items-center justify-center rounded-lg"><i class="fa-solid fa-plus text-[10px]"></i></button>
                        </div>
                    </div>

                    <div class="flex-1 flex flex-col items-center min-w-0">
                        <label class="block text-[11px] font-semibold text-gray-400 uppercase mb-1 text-center w-full">LÃI</label>
                        <div class="w-full bg-gray-900/90 border border-gray-800 px-2 rounded-xl h-9 flex items-center justify-center">
                            <div id="modal-profit-preview" class="text-xs font-bold text-emerald-400 leading-none truncate text-center w-full">0</div>
                        </div>
                    </div>

                    <div class="flex items-center gap-1 shrink-0">
                        <button type="button" onclick="closeModal()" class="px-3 h-9 rounded-xl text-xs font-semibold bg-gray-800 text-gray-300 hover:bg-gray-700 transition">HỦY</button>
                        <button type="submit" class="px-3 h-9 rounded-xl text-xs font-semibold bg-indigo-600 text-white hover:bg-indigo-500 transition shadow-lg shadow-indigo-600/30 whitespace-nowrap">LƯU</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBLC4dPLEP84yj6vkvf--DM8u_dN9YPJEs",
            authDomain: "bao-gia-sua-chua.firebaseapp.com",
            projectId: "bao-gia-sua-chua",
            storageBucket: "bao-gia-sua-chua.firebasestorage.app",
            messagingSenderId: "775400571262",
            appId: "1:775400571262:web:b264070746f5fbb6fbf32f"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let devices = [
            { id: 1, brand: 'IPHONE', part: 'MÀN HÌNH', type: 'ZIN', name: '14 PRO MAX', price: 1200, cost: 800, qty: 5 },
            { id: 2, brand: 'IPHONE', part: 'MÀN HÌNH', type: 'GX', name: '12 PRO MAX', price: 1400, cost: 950, qty: 2 },
            { id: 3, brand: 'SAMSUNG', part: 'PIN', type: 'ZIN HÃNG', name: 'S22 ULTRA - S23 ULTRA', price: 650, cost: 420, qty: 8 },
            { id: 4, brand: 'OPPO - REALME', part: 'KÍNH - C.ỨNG', type: 'ZIN', name: 'A17 - A57 - A18 - A58 - C1 - C12 - A54', price: 950, cost: 700, qty: 3 }
        ];
        let brands = ['IPHONE', 'SAMSUNG', 'OPPO - REALME', 'MI - POCO', 'VIVO', 'KHÁC'];
        let categories = ['MÀN HÌNH', 'PIN', 'KÍNH - C.ỨNG', 'CÁP/BO SẠC'];
        let types = ['ZIN', 'GX', 'ZIN BÓC MÁY', 'ZIN HÃNG', 'OLED', 'LINH KIỆN'];
        let names = ['14 PRO MAX', '12 PRO MAX', 'S22 ULTRA - S23 ULTRA', 'A17 - A57 - A18 - A58 - C1 - C12 - A54'];

        let currentBrand = brands[0] || '', currentCategory = categories[0] || '', currentType = '', isPrivacyMode = false;

        function syncFromCloud() {
            const statusEl = document.getElementById('cloud-status');
            statusEl.setAttribute('title', 'Đang đồng bộ...');
            statusEl.innerHTML = `<i class="fa-solid fa-cloud-arrow-up text-emerald-400 text-xs"></i>`;

            db.collection("store_data").doc("main").onSnapshot((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    if (data.devices) devices = data.devices;
                    if (data.brands) brands = data.brands;
                    if (data.categories) categories = data.categories;
                    if (data.types) types = data.types;
                    if (data.names) names = data.names;
                } else {
                    saveAllToCloud();
                }
                statusEl.setAttribute('title', 'Online Realtime');
                statusEl.innerHTML = `<i class="fa-solid fa-cloud text-emerald-400 text-xs"></i>`;
                if (!currentBrand && brands.length) currentBrand = brands[0];
                if (!currentCategory && categories.length) currentCategory = categories[0];
                initTabs();
                renderTable();
            }, (err) => {
                console.error("Lỗi Firestore:", err);
                statusEl.setAttribute('title', 'Lỗi quyền Firebase');
                statusEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-red-400 text-xs"></i>`;
            });
        }

        async function saveAllToCloud() {
            try {
                await db.collection("store_data").doc("main").set({
                    devices, brands, categories, types, names
                });
            } catch (e) {
                console.error("Lỗi lưu Cloud:", e);
            }
        }

        function initTabs() {
            document.getElementById('brand-tabs').innerHTML = brands.map(b => 
                `<button onclick="currentBrand='${b}'; initTabs(); renderTable();" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition uppercase ${b === currentBrand ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'}">${b === 'KHÁC' ? 'HÃNG KHÁC' : b}</button>`
            ).join('');

            const fixedCats = ['MÀN HÌNH', 'PIN'];
            document.getElementById('main-cat-tabs').innerHTML = fixedCats.map(c => 
                `<button onclick="currentCategory='${c}'; initTabs(); renderTable();" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold transition uppercase ${c === currentCategory ? 'bg-indigo-500/20 text-indigo-400 border border-indigo-500/30' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'}">${c}</button>`
            ).join('');

            const subCats = categories.filter(c => !fixedCats.includes(c));
            document.getElementById('sub-cat-list').innerHTML = subCats.length ? subCats.map(c => 
                `<button onclick="currentCategory='${c}'; initTabs(); renderTable(); toggleMoreCats(event);" class="w-full text-left px-3 py-2 rounded-lg text-xs font-semibold transition uppercase ${c === currentCategory ? 'bg-indigo-500/20 text-indigo-400' : 'text-gray-300 hover:bg-gray-800'}">${c}</button>`
            ).join('') : '<div class="px-3 py-1 text-xs text-gray-500 italic">Chưa có mục khác</div>';

            const btnType = document.getElementById('btn-type-filter');
            const lblType = document.getElementById('label-current-type');
            if (currentType) {
                lblType.innerText = currentType;
                lblType.className = "text-amber-400 font-bold";
            } else {
                lblType.innerText = "KIỂU";
                lblType.className = "text-red-500 font-bold";
            }

            const allTypeOption = `<button onclick="selectType('');" class="w-full text-left px-3 py-2 rounded-lg text-xs font-semibold transition uppercase ${currentType === '' ? 'bg-indigo-500/20 text-indigo-400' : 'text-gray-300 hover:bg-gray-800'}">-- TẤT CẢ --</button>`;
            const typeOptions = types.map(t => 
                `<button onclick="selectType('${t}');" class="w-full text-left px-3 py-2 rounded-lg text-xs font-semibold transition uppercase ${t === currentType ? 'bg-amber-400/20 text-amber-400' : 'text-gray-300 hover:bg-gray-800'}">${t}</button>`
            ).join('');
            document.getElementById('type-menu-list').innerHTML = allTypeOption + typeOptions;

            document.getElementById('brand-suggestions').innerHTML = brands.map(b => `<option value="${b}">`).join('');
            document.getElementById('part-suggestions').innerHTML = categories.map(c => `<option value="${c}">`).join('');
            document.getElementById('type-suggestions').innerHTML = types.map(t => `<option value="${t}">`).join('');
            document.getElementById('name-suggestions').innerHTML = names.map(n => `<option value="${n}">`).join('');
        }

        function toggleTypeFilter(e) {
            e.stopPropagation();
            document.getElementById('dropdown-more-cats')?.classList.add('hidden');
            document.getElementById('dropdown-types').classList.toggle('hidden');
        }

        function selectType(t) {
            currentType = t;
            document.getElementById('dropdown-types').classList.add('hidden');
            initTabs();
            renderTable();
        }

        function toggleMoreCats(e) { 
            e.stopPropagation(); 
            document.getElementById('dropdown-types')?.classList.add('hidden');
            document.getElementById('dropdown-more-cats').classList.toggle('hidden'); 
        }

        window.onclick = () => {
            document.getElementById('dropdown-more-cats')?.classList.add('hidden');
            document.getElementById('dropdown-types')?.classList.add('hidden');
        };

        function adjustQty(val) {
            const input = document.getElementById('device-qty');
            input.value = Math.max(0, (Number(input.value) || 0) + val);
            updateModalStats();
        }

        const parseNum = str => Number(String(str).replace(/\D/g, '')) || 0;
        const fmtVal = val => Number(val).toLocaleString('vi-VN');
        const fmtSecret = val => isPrivacyMode ? '***' : fmtVal(val);

        function formatCurrencyInput(input) {
            let digits = String(input.value).replace(/\D/g, '').slice(0, 5);
            input.value = digits ? Number(digits).toLocaleString('vi-VN') : '';
            updateModalStats();
        }

        function updateModalStats() {
            const p = parseNum(document.getElementById('device-price').value);
            const c = parseNum(document.getElementById('device-cost').value);
            document.getElementById('modal-profit-preview').innerText = fmtVal(p - c);
        }

        function openModal() {
            document.getElementById('modal-title').innerText = "THÊM THIẾT BỊ MỚI";
            document.getElementById('device-id').value = '';
            document.getElementById('device-form').reset();
            document.getElementById('device-qty').value = '1';
            document.getElementById('device-brand').value = currentBrand;
            document.getElementById('device-part').value = currentCategory;
            document.getElementById('device-modal').classList.remove('hidden');
            updateModalStats();
        }

        function closeModal() {
            document.getElementById('device-modal').classList.add('hidden');
        }

        function editDevice(id) {
            const item = devices.find(d => d.id === id);
            if (!item) return;
            document.getElementById('modal-title').innerText = "CHỈNH SỬA THIẾT BỊ";
            document.getElementById('device-id').value = item.id;
            document.getElementById('device-brand').value = item.brand;
            document.getElementById('device-name').value = item.name;
            document.getElementById('device-part').value = item.part;
            document.getElementById('device-type').value = item.type || '';
            document.getElementById('device-price').value = fmtVal(item.price);
            document.getElementById('device-cost').value = fmtVal(item.cost);
            document.getElementById('device-qty').value = item.qty;
            document.getElementById('device-modal').classList.remove('hidden');
            updateModalStats();
        }

        function duplicateDevice(id) {
            const item = devices.find(d => d.id === id);
            if (!item) return;
            document.getElementById('modal-title').innerText = "TẠO BẢN SAO THIẾT BỊ";
            document.getElementById('device-id').value = '';
            document.getElementById('device-brand').value = item.brand;
            document.getElementById('device-name').value = item.name;
            document.getElementById('device-part').value = item.part;
            document.getElementById('device-type').value = item.type || '';
            document.getElementById('device-price').value = fmtVal(item.price);
            document.getElementById('device-cost').value = fmtVal(item.cost);
            document.getElementById('device-qty').value = item.qty;
            document.getElementById('device-modal').classList.remove('hidden');
            updateModalStats();
        }

        async function saveDevice(e) {
            e.preventDefault();
            const id = document.getElementById('device-id').value;
            const brand = document.getElementById('device-brand').value.trim().toUpperCase();
            const name = document.getElementById('device-name').value.trim().toUpperCase();
            const part = document.getElementById('device-part').value.trim().toUpperCase();
            const type = document.getElementById('device-type').value.trim().toUpperCase();
            const price = parseNum(document.getElementById('device-price').value);
            const cost = parseNum(document.getElementById('device-cost').value);
            const qty = Number(document.getElementById('device-qty').value) || 0;

            if (!brands.includes(brand)) brands.push(brand);
            if (!categories.includes(part)) categories.push(part);
            if (type && !types.includes(type)) types.push(type);
            if (!names.includes(name)) names.push(name);

            if (id) {
                const idx = devices.findIndex(d => d.id == id);
                if (idx !== -1) {
                    devices[idx] = { id: Number(id), brand, name, part, type, price, cost, qty };
                }
            } else {
                const newId = devices.length ? Math.max(...devices.map(d => d.id)) + 1 : 1;
                devices.push({ id: newId, brand, name, part, type, price, cost, qty });
            }

            await saveAllToCloud();
            closeModal();
            initTabs();
            renderTable();
        }

        async function deleteDevice(id) {
            if (confirm("BẠN CÓ CHẮC MUỐN XÓA THIẾT BỊ NÀY?")) {
                devices = devices.filter(d => d.id !== id);
                await saveAllToCloud();
                renderTable();
            }
        }

        async function handleEntity(type, act) {
            const map = {
                brands: { list: brands, el: 'device-brand', name: 'HÃNG', devKey: 'brand' },
                names: { list: names, el: 'device-name', name: 'TÊN MÁY', devKey: 'name' },
                categories: { list: categories, el: 'device-part', name: 'LINH KIỆN', devKey: 'part' },
                types: { list: types, el: 'device-type', name: 'KIỂU', devKey: 'type' }
            };
            const meta = map[type];
            let val = document.getElementById(meta.el).value.trim().toUpperCase();

            if (act === 'add') {
                const res = prompt(`NHẬP ${meta.name} MỚI:`);
                if (res && res.trim()) {
                    const up = res.trim().toUpperCase();
                    if (!meta.list.includes(up)) {
                        meta.list.push(up);
                        await saveAllToCloud();
                    }
                    document.getElementById(meta.el).value = up;
                    initTabs();
                    renderTable();
                }
            } else if (act === 'edit') {
                if (!val) return alert(`CHƯA CHỌN HOẶC NHẬP ${meta.name} ĐỂ SỬA!`);
                const res = prompt(`CHỈNH SỬA ${meta.name} "${val}":`, val);
                if (res && res.trim()) {
                    const up = res.trim().toUpperCase();
                    const idx = meta.list.indexOf(val);
                    if (idx !== -1) meta.list[idx] = up;
                    else meta.list.push(up);
                    
                    devices.forEach(d => { if ((d[meta.devKey] || '').toUpperCase() === val) d[meta.devKey] = up; });
                    await saveAllToCloud();
                    document.getElementById(meta.el).value = up;
                    initTabs();
                    renderTable();
                }
            } else if (act === 'delete') {
                if (!val) return alert(`CHƯA CHỌN HOẶC NHẬP ${meta.name} ĐỂ XÓA!`);
                if (confirm(`BẠN CÓ CHẮC MUỐN XÓA ${meta.name} "${val}" KHỎI DANH SÁCH GỢI Ý?`)) {
                    const updated = meta.list.filter(item => item !== val);
                    if (type === 'brands') brands = updated;
                    else if (type === 'names') names = updated;
                    else if (type === 'categories') categories = updated;
                    else if (type === 'types') types = updated;
                    await saveAllToCloud();
                    document.getElementById(meta.el).value = '';
                    initTabs();
                    renderTable();
                }
            }
        }

        function togglePrivacyMode() {
            isPrivacyMode = !isPrivacyMode;
            document.getElementById('privacy-icon').className = isPrivacyMode ? "fa-solid fa-eye-slash text-amber-400 text-sm" : "fa-solid fa-eye text-sm";
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('device-table-body');
            const mobileList = document.getElementById('device-mobile-list');
            const kw = document.getElementById('search-input').value.toLowerCase();
            tbody.innerHTML = '';
            mobileList.innerHTML = '';

            let total = 0;
            devices.forEach(d => total += d.cost * d.qty);
            document.getElementById('total-cost').innerText = fmtSecret(total);

            const filtered = devices.filter(d => 
                d.brand === currentBrand && 
                (!currentCategory || (d.part || '').toLowerCase().includes(currentCategory.toLowerCase())) &&
                (!currentType || (d.type || '').toUpperCase() === currentType.toUpperCase()) &&
                `${d.part || ''} ${d.type || ''} ${d.name}`.toLowerCase().includes(kw)
            ).sort((a, b) => a.name.localeCompare(b.name, 'vi', { numeric: true }));

            document.getElementById('empty-state').classList.toggle('hidden', filtered.length > 0);

            filtered.forEach(item => {
                const profit = item.price - item.cost;
                const clean = item.brand.toLowerCase() === 'iphone' ? item.name.replace(/iphone\s*/gi, '').trim() : item.name;
                const sub = (clean.includes('-') || clean.includes(',')) ? clean.split(/[-|,]/).map(p => p.trim()).filter(Boolean) : [clean];
                const tags = sub.map((m, idx) => `<span class="px-2 py-0.5 bg-gray-800 ${idx % 2 === 0 ? 'text-amber-400' : 'text-white'} border border-gray-700 text-xs md:text-sm font-bold rounded uppercase">${m}</span>`).join(' ');

                // Desktop Table Row
                tbody.innerHTML += `
                    <tr class="row-hover transition border-b border-gray-800/40">
                        <td class="py-3 px-4 text-center"><span class="px-2 py-1 bg-gray-800 text-indigo-400 border border-gray-700 text-xs font-bold rounded-lg uppercase">${item.brand}</span></td>
                        <td class="py-3 px-4 text-center"><div class="flex flex-wrap gap-1.5 items-center justify-center">${tags}</div></td>
                        <td class="py-3 px-4 text-center font-medium text-white uppercase text-xs">${(item.part || 'LINH KIỆN').toUpperCase()}</td>
                        <td class="py-3 px-3 text-center font-bold text-emerald-400 uppercase text-xs">${(item.type || '').toUpperCase()}</td>
                        <td class="py-3 px-4 text-center font-black text-red-500 text-xl">${fmtVal(item.price)}</td>
                        <td class="py-3 px-4 text-center font-semibold text-amber-400 text-[11px]">${fmtSecret(item.cost)}</td>
                        <td class="py-3 px-3 text-center font-bold text-white text-xs">${item.qty}</td>
                        <td class="py-3 px-4 text-center">
                            <div class="flex items-center justify-center gap-2">
                                <button onclick="duplicateDevice(${item.id})" class="p-1.5 bg-emerald-600/20 hover:bg-emerald-600 text-emerald-400 hover:text-white rounded-lg transition" title="TẠO BẢN SAO"><i class="fa-solid fa-copy text-xs"></i></button>
                                <button onclick="editDevice(${item.id})" class="p-1.5 bg-blue-600/20 hover:bg-blue-600 text-blue-400 hover:text-white rounded-lg transition" title="SỬA"><i class="fa-solid fa-pen text-xs"></i></button>
                                <button onclick="deleteDevice(${item.id})" class="p-1.5 bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white rounded-lg transition" title="XÓA"><i class="fa-solid fa-trash text-xs"></i></button>
                            </div>
                        </td>
                        <td class="py-3 px-4 text-center font-semibold text-emerald-400 text-[11px]">${fmtSecret(profit)}</td>
                    </tr>
                `;

                // Mobile Card List
                mobileList.innerHTML += `
                    <div class="p-3 flex items-center justify-between gap-2">
                        <div class="flex items-center gap-2 shrink-0">
                            <span class="px-2 py-1 bg-gray-800 text-indigo-400 border border-gray-700 text-[11px] font-bold rounded-lg uppercase">${item.brand}</span>
                            <div class="flex gap-1 items-center">${tags}</div>
                            <span class="font-medium text-white text-xs uppercase">${(item.part || '').toUpperCase()}</span>
                        </div>
                        <div class="text-[11px] font-bold text-emerald-400 uppercase text-center px-2">${(item.type || '')}</div>
                        <div class="font-black text-red-500 text-lg shrink-0">${fmtVal(item.price)}</div>
                    </div>
                `;
            });
        }

        // Khởi chạy đồng bộ
        syncFromCloud();
    </script>
</body>
</html>
