<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BÁO GIÁ SỬA CHỮA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- FIREBASE COMPAT SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; font-size: 1.15rem; }
        .card-dark { background-color: #111827; border: 1px solid #1f2937; }
        .row-hover:hover { background-color: rgba(31, 41, 55, 0.5); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        /* Ẩn thanh cuộn ngang nhưng vẫn vuốt được mượt mà */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes yellowRowPulse {
            0%, 100% {
                background-color: rgba(234, 179, 8, 0.35);
                box-shadow: inset 0 0 12px rgba(234, 179, 8, 0.3);
            }
            50% {
                background-color: rgba(234, 179, 8, 0.05);
                box-shadow: none;
            }
        }
        .yellow-pulse-row { animation: yellowRowPulse 1.6s ease-in-out infinite; }

        @keyframes yellowBadgePulse {
            0%, 100% { background-color: rgba(234, 179, 8, 0.95); color: #dc2626; }
            50% { background-color: rgba(234, 179, 8, 0.3); color: #ef4444; }
        }
        .yellow-pulse-badge { animation: yellowBadgePulse 1.6s ease-in-out infinite; }

        @keyframes pinkSelectionPulse {
            0%, 100% {
                background-color: rgba(236, 72, 153, 0.95);
                box-shadow: 0 0 12px rgba(236, 72, 153, 0.6);
            }
            50% {
                background-color: rgba(236, 72, 153, 0.4);
                box-shadow: 0 0 4px rgba(236, 72, 153, 0.2);
            }
        }
        .pink-pulse-selected { animation: pinkSelectionPulse 1.6s ease-in-out infinite; }
    </style>
</head>
<body class="min-h-screen p-2 md:p-6 uppercase">

    <div class="max-w-7xl mx-auto space-y-3 md:space-y-6 flex flex-col items-center">
        <!-- THANH CÔNG CỤ & THỐNG KÊ -->
        <div class="card-dark p-2.5 md:p-4 rounded-2xl flex flex-col gap-2.5 shadow-lg w-full">
            <div class="flex flex-col gap-2.5">
                <!-- HÀNG 1: CÁC HÃNG & THÔNG TIN ẨN/HIỆN, VỐN -->
                <div class="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-2">
                    <div class="flex flex-wrap items-center gap-1 overflow-x-auto pb-1 xl:pb-0" id="brand-tabs"></div>

                    <div class="hidden xl:flex items-center gap-1 bg-gray-900/90 p-1 rounded-2xl border border-gray-800 overflow-hidden shrink-0 self-end xl:self-auto">
                        <button onclick="togglePrivacyMode()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-xl text-sm font-medium border border-gray-700 transition flex items-center justify-center w-8 h-8 shrink-0" title="ẨN / HIỆN VỐN & LÃI">
                            <i class="fa-solid fa-eye text-xs" id="privacy-icon"></i>
                        </button>
                        <div id="cloud-status" class="flex w-8 h-8 bg-gray-800 rounded-xl border border-gray-700 items-center justify-center shrink-0" title="Đang kết nối...">
                            <i class="fa-solid fa-circle-notch fa-spin text-amber-400 text-xs"></i>
                        </div>
                        <div class="flex items-center gap-1 bg-gray-900 px-2 py-1 rounded-xl border border-gray-800 shrink-0">
                            <div>
                                <div class="text-[10px] text-gray-400 uppercase tracking-wider text-center">VỐN</div>
                                <div id="total-cost" class="text-xs font-bold text-amber-400 text-center">0</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- HÀNG 2 (DESKTOP): LINH KIỆN + KIỂU + TÌM KIẾM + THÊM MỚI -->
                <div class="hidden xl:flex items-center justify-between gap-3 pt-2 border-t border-gray-800/80 w-full">
                    <div class="flex flex-col gap-2">
                        <div class="flex items-center gap-1.5 shrink-0">
                            <span class="text-sm font-bold text-amber-400 uppercase mr-1">LINH KIỆN:</span>
                            <div id="main-cat-tabs-desktop" class="flex items-center gap-1"></div>
                        </div>
                        <div id="type-tabs-container-desktop" class="flex items-center gap-1.5 shrink-0"></div>
                    </div>

                    <div class="relative flex-1 max-w-md">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-500">
                            <i class="fa-solid fa-magnifying-glass text-xs"></i>
                        </span>
                        <input type="text" id="search-input-desktop" oninput="handleSearchInput(this)" placeholder="TÌM KIẾM..." 
                            class="w-full pl-9 pr-9 py-2 bg-gray-900 border border-gray-700 rounded-xl text-sm focus:outline-none focus:border-indigo-500 text-white placeholder-gray-500 uppercase">
                        <button id="btn-clear-search-desktop" onclick="clearSearch()" class="hidden absolute inset-y-0 right-0 px-3 flex items-center text-gray-400 hover:text-white transition text-sm" title="XÓA TÌM KIẾM">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>

                    <div class="shrink-0">
                        <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition flex items-center gap-1.5 shadow-lg shadow-indigo-600/35">
                            <i class="fa-solid fa-plus text-xs"></i> THÊM MỚI
                        </button>
                    </div>
                </div>

                <!-- PHẦN GIAO DIỆN MOBILE -->
                <div class="flex xl:hidden flex-col gap-2 pt-2 border-t border-gray-800/80">
                    <div class="flex items-center gap-1 relative w-full pt-1 overflow-x-auto no-scrollbar whitespace-nowrap">
                        <span class="text-xs font-bold text-amber-400 uppercase mr-0.5 shrink-0">LINH KIỆN:</span>
                        <div id="main-cat-tabs-mobile" class="inline-flex items-center gap-1 shrink-0"></div>
                    </div>

                    <div id="type-tabs-container-mobile" class="flex flex-wrap items-center gap-1 w-full pt-1"></div>

                    <div class="flex items-center justify-between gap-1.5 w-full">
                        <div class="relative flex-1">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-2.5 pointer-events-none text-gray-500">
                                <i class="fa-solid fa-magnifying-glass text-xs"></i>
                            </span>
                            <input type="text" id="search-input-mobile" oninput="handleSearchInput(this)" placeholder="TÌM KIẾM..." 
                                class="w-full pl-8 pr-8 py-1.5 bg-gray-900 border border-gray-700 rounded-xl text-xs focus:outline-none focus:border-indigo-500 text-white placeholder-gray-500 uppercase">
                            <button id="btn-clear-search-mobile" onclick="clearSearch()" class="hidden absolute inset-y-0 right-0 px-2.5 flex items-center text-gray-400 hover:text-white transition text-sm" title="XÓA TÌM KIẾM">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- BẢNG DỮ LIỆU -->
        <div class="card-dark rounded-2xl overflow-hidden shadow-xl w-full">
            <div class="hidden md:block overflow-x-auto">
                <table class="w-full text-center border-collapse">
                    <thead>
                        <tr id="desktop-table-header" class="bg-indigo-600 text-white text-sm uppercase tracking-wider shadow-sm"></tr>
                    </thead>
                    <tbody id="device-table-body" class="divide-y divide-gray-800/60 text-base"></tbody>
                </table>
            </div>

            <div class="md:hidden divide-y divide-gray-800/40 px-2" id="device-mobile-list"></div>

            <div id="empty-state" class="hidden text-center py-12 text-gray-500">
                <i class="fa-solid fa-box-open text-3xl mb-2"></i>
                <p class="text-sm">KHÔNG TÌM THẤY THIẾT BỊ NÀO PHÙ HỢP.</p>
            </div>

            <!-- PHẦN HIỂN THỊ SỐ LƯỢNG DÒNG Ở CUỐI TRANG -->
            <div class="px-4 py-3 bg-gray-900/60 border-t border-gray-800 flex justify-between items-center text-xs md:text-sm text-gray-400">
                <span>TỔNG SỐ DÒNG: <strong id="row-count" class="text-amber-400 font-bold">0</strong></span>
                <span class="text-[11px] text-gray-500">KIM CHI MOBILE</span>
            </div>
        </div>
    </div>

    <!-- MODAL THÊM / SỬA -->
    <div id="device-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-3 hidden">
        <div class="card-dark w-full max-w-xl rounded-2xl p-4 md:p-6 shadow-2xl border border-gray-700 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-3">
                <h3 id="modal-title" class="text-base md:text-xl font-bold text-pink-500 uppercase">THÊM LINH KIỆN MỚI</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="device-form" onsubmit="saveDevice(event)" class="space-y-3">
                <input type="hidden" id="device-index" value="-1">
                <input type="hidden" id="device-id">

                <div>
                    <label class="block text-sm font-bold text-amber-400 uppercase mb-1">HÃNG</label>
                    <div class="flex items-center gap-2">
                        <input type="text" id="device-brand" required list="brand-suggestions" class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 uppercase">
                        <datalist id="brand-suggestions"></datalist>
                        <div class="flex items-center gap-1">
                            <button type="button" onclick="handleEntity('brands', 'add')" class="w-6 h-7 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg transition flex items-center justify-center font-bold text-xs shadow" title="THÊM HÃNG"><i class="fa-solid fa-plus"></i></button>
                            <button type="button" onclick="handleEntity('brands', 'edit')" class="w-6 h-7 bg-blue-600 hover:bg-blue-500 text-white rounded-lg transition flex items-center justify-center font-bold text-xs shadow" title="SỬA HÃNG"><i class="fa-solid fa-pen text-[10px]"></i></button>
                            <button type="button" onclick="handleEntity('brands', 'delete')" class="w-6 h-7 bg-red-600 hover:bg-red-500 text-white rounded-lg transition flex items-center justify-center font-bold text-xs shadow" title="XÓA HÃNG"><i class="fa-solid fa-trash text-[10px]"></i></button>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-amber-400 uppercase mb-1">TÊN MÁY</label>
                    <div class="flex items-center gap-2">
                        <input type="text" id="device-name" required class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 uppercase" autocomplete="off">
                        <div class="flex items-center gap-1">
                            <button type="button" onclick="handleEntity('names', 'add')" class="w-6 h-7 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg transition flex items-center justify-center font-bold text-xs shadow" title="THÊM TÊN MÁY"><i class="fa-solid fa-plus"></i></button>
                            <button type="button" onclick="handleEntity('names', 'edit')" class="w-6 h-7 bg-blue-600 hover:bg-blue-500 text-white rounded-lg transition flex items-center justify-center font-bold text-xs shadow" title="SỬA TÊN MÁY"><i class="fa-solid fa-pen text-[10px]"></i></button>
                            <button type="button" onclick="handleEntity('names', 'delete')" class="w-6 h-7 bg-red-600 hover:bg-red-500 text-white rounded-lg transition flex items-center justify-center font-bold text-xs shadow" title="XÓA TÊN MÁY"><i class="fa-solid fa-trash text-[10px]"></i></button>
                        </div>
                    </div>
                    <datalist id="name-suggestions"></datalist>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-bold text-amber-400 uppercase mb-1">LINH KIỆN</label>
                        <div class="flex items-center gap-2">
                            <input type="text" id="device-part" required list="part-suggestions" oninput="onModalPartChange()" class="flex-1 min-w-0 bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white text-center focus:outline-none focus:border-indigo-500 uppercase">
                            <datalist id="part-suggestions"></datalist>
                            <div class="flex items-center gap-1 shrink-0">
                                <button type="button" onclick="handleEntity('categories', 'add')" class="w-6 h-7 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg transition flex items-center justify-center font-bold text-xs shadow" title="THÊM"><i class="fa-solid fa-plus"></i></button>
                                <button type="button" onclick="handleEntity('categories', 'edit')" class="w-6 h-7 bg-blue-600 hover:bg-blue-500 text-white rounded-lg transition flex items-center justify-center font-bold text-xs shadow" title="SỬA"><i class="fa-solid fa-pen text-[10px]"></i></button>
                                <button type="button" onclick="handleEntity('categories', 'delete')" class="w-6 h-7 bg-red-600 hover:bg-red-500 text-white rounded-lg transition flex items-center justify-center font-bold text-xs shadow" title="XÓA"><i class="fa-solid fa-trash text-[10px]"></i></button>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-amber-400 uppercase mb-1">KIỂU</label>
                        <div class="flex items-center gap-2">
                            <input type="text" id="device-type" list="type-suggestions" class="flex-1 min-w-0 bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white text-center focus:outline-none focus:border-indigo-500 uppercase">
                            <datalist id="type-suggestions"></datalist>
                            <div class="flex items-center gap-1 shrink-0">
                                <button type="button" onclick="handleEntity('types', 'add')" class="w-6 h-7 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg transition flex items-center justify-center font-bold text-xs shadow" title="THÊM"><i class="fa-solid fa-plus"></i></button>
                                <button type="button" onclick="handleEntity('types', 'edit')" class="w-6 h-7 bg-blue-600 hover:bg-blue-500 text-white rounded-lg transition flex items-center justify-center font-bold text-xs shadow" title="SỬA"><i class="fa-solid fa-pen text-[10px]"></i></button>
                                <button type="button" onclick="handleEntity('types', 'delete')" class="w-6 h-7 bg-red-600 hover:bg-red-500 text-white rounded-lg transition flex items-center justify-center font-bold text-xs shadow" title="XÓA"><i class="fa-solid fa-trash text-[10px]"></i></button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-sm font-bold text-amber-400 uppercase mb-1 text-center">GIÁ BÁN</label>
                        <input type="text" id="device-price" required maxlength="6" oninput="formatCurrencyInput(this)" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white text-center focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-amber-400 uppercase mb-1 text-center">GIÁ NHẬP</label>
                        <input type="text" id="device-cost" required maxlength="6" oninput="formatCurrencyInput(this)" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white text-center focus:outline-none focus:border-indigo-500">
                    </div>
                </div>

                <div class="flex items-end gap-2 pt-1">
                    <div class="flex flex-col items-center">
                        <label class="block text-sm font-bold text-amber-400 uppercase mb-1 text-center w-full">SL</label>
                        <div class="flex items-center bg-gray-900 border border-gray-700 rounded-xl overflow-hidden p-0.5 h-10">
                            <button type="button" onclick="adjustQty(-1)" class="w-8 h-9 bg-gray-800 text-white font-bold transition flex items-center justify-center rounded-lg"><i class="fa-solid fa-minus text-xs"></i></button>
                            <input type="number" id="device-qty" required value="1" min="0" oninput="updateModalStats()" class="w-9 bg-transparent text-sm font-bold text-white text-center focus:outline-none">
                            <button type="button" onclick="adjustQty(1)" class="w-8 h-9 bg-gray-800 text-white font-bold transition flex items-center justify-center rounded-lg"><i class="fa-solid fa-plus text-xs"></i></button>
                        </div>
                    </div>

                    <div class="flex flex-col items-center">
                        <label class="block text-sm font-bold text-amber-400 uppercase mb-1 text-center w-full">MÀU</label>
                        <input type="text" id="device-color" list="color-suggestions" placeholder="" class="w-24 bg-gray-900 border border-gray-700 rounded-xl px-2 py-2 text-sm text-white text-center focus:outline-none focus:border-indigo-500 uppercase h-10">
                        <datalist id="color-suggestions">
                            <option value="ĐEN"><option value="TRẮNG"><option value="ĐỎ"><option value="VÀNG"><option value="XANH">
                        </datalist>
                    </div>

                    <div class="flex-1 flex flex-col items-center min-w-0">
                        <label class="block text-sm font-bold text-amber-400 uppercase mb-1 text-center w-full">LÃI</label>
                        <div class="w-full bg-gray-900/90 border border-gray-800 px-2 rounded-xl h-10 flex items-center justify-center">
                            <div id="modal-profit-preview" class="text-xs font-bold text-emerald-400 leading-none truncate text-center w-full">0</div>
                        </div>
                    </div>

                    <div class="flex items-center gap-1 shrink-0">
                        <button type="button" onclick="closeModal()" class="px-3.5 h-10 rounded-xl text-sm font-semibold bg-gray-800 text-gray-300 hover:bg-gray-700 transition">HỦY</button>
                        <button type="submit" class="px-4 h-10 rounded-xl text-sm font-semibold bg-indigo-600 text-white hover:bg-indigo-500 transition shadow-lg shadow-indigo-600/35 whitespace-nowrap">LƯU</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBLC4dPLEP84yj6vkvf--DM8u_dN9YPJEs",
            authDomain: "bao-gia-sua-chua.firebaseapp.com",
            projectId: "bao-gia-sua-chua",
            storageBucket: "bao-gia-sua-chua.firebasestorage.app",
            messagingSenderId: "775400571262",
            appId: "1:775400571262:web:b264070746f5fbb6fbf32f"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let devices = [];
        let brands = ['IPHONE', 'SAMSUNG', 'OPPO - REALME', 'MI - POCO', 'VIVO', 'KHÁC'];
        let categories = ['MÀN HÌNH', 'PIN', 'BO SẠC', 'KÍNH ÉP', 'LƯNG'];
        let types = ['ZIN', 'GX', 'ZIN BÓC MÁY', 'ZIN HÃNG', 'OLED', 'LINH KIỆN'];
        let names = [];

        let currentBrand = brands[0] || '', currentCategory = 'MÀN HÌNH', currentType = '', isPrivacyMode = false;

        function getColorHex(colorName) {
            if (!colorName) return '';
            const c = colorName.trim().toUpperCase();
            if (c.includes('ĐEN') || c.includes('BLACK')) return '#111827; border: 1px solid #4b5563';
            if (c.includes('TRẮNG') || c.includes('WHITE')) return '#f9fafb';
            if (c.includes('ĐỎ') || c.includes('RED')) return '#ef4444';
            if (c.includes('VÀNG') || c.includes('GOLD') || c.includes('YELLOW')) return '#eab308';
            if (c.includes('XANH') || c.includes('BLUE') || c.includes('GREEN')) return '#3b82f6';
            if (c.includes('HỒNG') || c.includes('PINK')) return '#ec4899';
            if (c.includes('TÍM') || c.includes('PURPLE')) return '#a855f7';
            if (c.includes('XÁM') || c.includes('GRAY') || c.includes('GREY')) return '#6b7280';
            return '#9ca3af';
        }

        function renderDeviceNames(nameStr, colorStr, isMobile = false) {
            if (!nameStr) return '';
            const isIphone = currentBrand.toUpperCase() === 'IPHONE';
            
            let processedName = nameStr;
            if (!isIphone) {
                processedName = processedName.replace(/I/g, 'i');
            }

            const parts = processedName.split('-').map(p => p.trim()).filter(Boolean);
            const appleIcon = isIphone ? `<i class="fa-brands fa-apple text-pink-500 ${isMobile ? 'text-sm' : 'text-base'} mr-1 align-middle"></i>` : '';

            let colorDotHtml = '';
            if (colorStr && colorStr.trim()) {
                const hexStyle = getColorHex(colorStr);
                const dotSize = isMobile ? 'w-3 h-3' : 'w-3.5 h-3.5';
                colorDotHtml = `<span class="inline-block ${dotSize} rounded-full ml-1 mr-0.5 shrink-0 align-middle shadow-sm" style="background-color: ${hexStyle};" title="MÀU: ${colorStr}"></span>`;
            }

            const dashCount = (processedName.match(/-/g) || []).length;
            const isVeryLong = dashCount >= 10;

            if (isMobile) {
                const textSizeClass = isVeryLong ? 'text-xs' : 'text-sm font-bold';
                const namePartsHtml = parts.map((part, index) => {
                    const textColor = isIphone ? 'text-white' : ((index % 2 === 0) ? 'text-amber-400' : 'text-white');
                    return `<span class="px-1 py-0.5 rounded bg-gray-900 border border-gray-800 ${textColor} ${textSizeClass} inline-block whitespace-nowrap">${part}</span>`;
                }).join(' ');
                return `<div class="inline-flex items-center flex-wrap">${appleIcon}${namePartsHtml}${colorDotHtml}</div>`;
            }

            const fontSizeClass = isVeryLong ? 'text-xs' : 'text-base md:text-lg';
            const paddingClass = isVeryLong ? 'px-1 py-0.25 m-0.25' : 'px-1 py-0.25 m-0.25';

            const namePartsHtml = parts.map((part, index) => {
                const textColor = isIphone ? 'text-white' : ((index % 2 === 0) ? 'text-amber-400' : 'text-white');
                return `<span class="rounded bg-gray-800/90 border border-gray-700/60 ${textColor} font-extrabold whitespace-nowrap ${fontSizeClass} inline-block ${paddingClass}">${part}</span>`;
            }).join('');

            return `<div class="inline-flex items-center flex-nowrap whitespace-nowrap justify-start">${appleIcon}${namePartsHtml}${colorDotHtml}</div>`;
        }

        function syncFromCloud() {
            const statusEl = document.getElementById('cloud-status');
            if(statusEl) {
                statusEl.setAttribute('title', 'Đang đồng bộ...');
                statusEl.innerHTML = `<i class="fa-solid fa-cloud-arrow-up text-emerald-400 text-xs"></i>`;
            }

            db.collection("store_data").doc("main").onSnapshot((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    if (data.devices) devices = data.devices;
                    if (data.brands) brands = data.brands;
                    if (data.categories) categories = data.categories;
                    if (data.types) types = data.types;
                    if (data.names) names = data.names;
                } else {
                    saveAllToCloud();
                }
                if(statusEl) {
                    statusEl.setAttribute('title', 'Online Realtime');
                    statusEl.innerHTML = `<i class="fa-solid fa-cloud text-emerald-400 text-xs"></i>`;
                }
                if (!currentBrand && brands.length) currentBrand = brands[0];
                if (!currentCategory) currentCategory = 'MÀN HÌNH';
                initTabs();
                renderTable();
            }, (err) => {
                console.error("Lỗi Firestore:", err);
                if(statusEl) {
                    statusEl.setAttribute('title', 'Lỗi quyền Firebase');
                    statusEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-red-400 text-xs"></i>`;
                }
            });
        }

        async function saveAllToCloud() {
            try {
                await db.collection("store_data").doc("main").set({
                    devices, brands, categories, types, names
                });
            } catch (e) {
                console.error("Lỗi lưu Cloud:", e);
            }
        }

        function initTabs() {
            document.getElementById('brand-tabs').innerHTML = brands.map(b => {
                const isSelected = b === currentBrand;
                const btnClass = isSelected 
                    ? 'pink-pulse-selected text-white font-bold shadow-lg' 
                    : 'bg-gray-800 text-gray-300 hover:bg-gray-700';
                return `<button onclick="currentBrand='${b}'; currentCategory='MÀN HÌNH'; currentType=''; initTabs(); renderTable();" class="px-2.5 py-1 md:px-3 md:py-1.5 rounded-lg text-xs md:text-sm font-semibold transition uppercase ${btnClass}">${b === 'KHÁC' ? 'HÃNG KHÁC' : b}</button>`;
            }).join('');

            const isIphone = currentBrand.toUpperCase() === 'IPHONE';

            let displayCategories = ['MÀN HÌNH', 'PIN', 'BO SẠC', 'KÍNH ÉP'];
            if (isIphone) {
                displayCategories.push('LƯNG');
            }

            if (!displayCategories.includes(currentCategory)) {
                currentCategory = displayCategories[0];
            }

            const catHtmlDesktop = displayCategories.map(c => {
                const isSelected = c === currentCategory;
                const btnClass = isSelected 
                    ? 'pink-pulse-selected text-white font-bold shadow-lg border border-pink-400' 
                    : 'bg-gray-800 text-gray-300 hover:bg-gray-700';
                return `<button onclick="currentCategory='${c}'; currentType=''; initTabs(); renderTable();" class="px-2.5 py-1.5 rounded-lg text-sm font-semibold transition uppercase ${btnClass}">${c}</button>`;
            }).join('');

            const catHtmlMobile = displayCategories.map(c => {
                const isSelected = c === currentCategory;
                const btnClass = isSelected 
                    ? 'pink-pulse-selected text-white font-bold shadow-lg border border-pink-400 shrink-0' 
                    : 'bg-gray-800 text-gray-300 hover:bg-gray-700 shrink-0';
                return `<button onclick="currentCategory='${c}'; currentType=''; initTabs(); renderTable();" class="px-2 py-1 rounded-lg text-xs font-semibold transition uppercase ${btnClass}">${c}</button>`;
            }).join('');

            document.getElementById('main-cat-tabs-desktop').innerHTML = catHtmlDesktop;
            document.getElementById('main-cat-tabs-mobile').innerHTML = catHtmlMobile;

            if (!isIphone) currentType = '';

            let typeButtonsHtml = '';
            let typeButtonsMobileHtml = '';

            if (isIphone) {
                const validTypesSet = new Set();
                devices.forEach(d => {
                    if ((d.brand || '').toUpperCase() === currentBrand.toUpperCase() &&
                        (d.part || '').toUpperCase() === currentCategory.toUpperCase() &&
                        d.type) {
                        validTypesSet.add(d.type.toUpperCase());
                    }
                });

                const allTypeSelected = currentType === '';
                const allTypeClass = allTypeSelected 
                    ? 'pink-pulse-selected text-white font-bold shadow-lg border border-pink-400 shrink-0' 
                    : 'bg-gray-800 text-gray-300 hover:bg-gray-700 shrink-0';
                
                typeButtonsHtml += `<button onclick="currentType=''; initTabs(); renderTable();" class="px-2.5 py-1 rounded-lg text-xs font-semibold transition uppercase ${allTypeClass}">TẤT CẢ</button>`;
                typeButtonsMobileHtml += `<button onclick="currentType=''; initTabs(); renderTable();" class="px-2 py-1 rounded-lg text-xs font-semibold transition uppercase ${allTypeClass}">TẤT CẢ</button>`;

                types.forEach(t => {
                    if (validTypesSet.has(t.toUpperCase())) {
                        const isSelected = currentType === t;
                        const btnClass = isSelected 
                            ? 'pink-pulse-selected text-white font-bold shadow-lg border border-pink-400 shrink-0' 
                            : 'bg-gray-800 text-gray-300 hover:bg-gray-700 shrink-0';
                        typeButtonsHtml += `<button onclick="currentType='${t}'; initTabs(); renderTable();" class="px-2.5 py-1 rounded-lg text-xs font-semibold transition uppercase ${btnClass}">${t}</button>`;
                        typeButtonsMobileHtml += `<button onclick="currentType='${t}'; initTabs(); renderTable();" class="px-2 py-1 rounded-lg text-xs font-semibold transition uppercase ${btnClass}">${t}</button>`;
                    }
                });
            }

            const typeContainerDesktop = document.getElementById('type-tabs-container-desktop');
            const typeContainerMobile = document.getElementById('type-tabs-container-mobile');

            if (typeContainerDesktop) {
                if (isIphone && typeButtonsHtml !== '') {
                    typeContainerDesktop.style.display = 'flex';
                    typeContainerDesktop.innerHTML = `<span class="text-sm font-bold text-red-500 uppercase mr-1">KIỂU:</span>` + typeButtonsHtml;
                } else {
                    typeContainerDesktop.style.display = 'none';
                    typeContainerDesktop.innerHTML = '';
                }
            }

            if (typeContainerMobile) {
                if (isIphone && typeButtonsMobileHtml !== '') {
                    typeContainerMobile.style.display = 'flex';
                    typeContainerMobile.className = "flex items-center gap-1 w-full pt-1 overflow-x-auto no-scrollbar whitespace-nowrap";
                    typeContainerMobile.innerHTML = `<span class="text-xs font-bold text-red-500 uppercase mr-0.5 shrink-0">KIỂU:</span>` + typeButtonsMobileHtml;
                } else {
                    typeContainerMobile.style.display = 'none';
                    typeContainerMobile.innerHTML = '';
                }
            }
        }

        function formatMoney(amount) {
            return Number(amount).toLocaleString('vi-VN');
        }

        function parseMoney(str) {
            if (!str) return 0;
            return parseInt(str.toString().replace(/\./g, ''), 10) || 0;
        }

        function formatCurrencyInput(input) {
            let val = input.value.replace(/\D/g, '');
            if (val) {
                val = parseInt(val, 10).toLocaleString('vi-VN');
            }
            input.value = val;
        }

        function togglePrivacyMode() {
            isPrivacyMode = !isPrivacyMode;
            const icon = document.getElementById('privacy-icon');
            if (icon) {
                icon.className = isPrivacyMode ? "fa-solid fa-eye-slash text-xs text-red-400" : "fa-solid fa-eye text-xs";
            }
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('device-table-body');
            const mobileList = document.getElementById('device-mobile-list');
            const emptyState = document.getElementById('empty-state');
            const rowCountEl = document.getElementById('row-count');
            const totalCostEl = document.getElementById('total-cost');

            const searchInputDesktop = document.getElementById('search-input-desktop');
            const searchInputMobile = document.getElementById('search-input-mobile');
            const keyword = (searchInputDesktop?.value || searchInputMobile?.value || '').trim().toUpperCase();

            const isIphone = currentBrand.toUpperCase() === 'IPHONE';

            const filtered = devices.filter(d => {
                const matchBrand = (d.brand || '').toUpperCase() === currentBrand.toUpperCase();
                const matchCategory = (d.part || '').toUpperCase() === currentCategory.toUpperCase();
                const matchType = (!isIphone || !currentType || (d.type || '').toUpperCase() === currentType.toUpperCase());

                const fullSearchStr = `${d.brand} ${d.name} ${d.part} ${d.type} ${d.color}`.toUpperCase();
                const matchKeyword = !keyword || keyword.split(' ').every(k => fullSearchStr.includes(k));

                return matchBrand && matchCategory && matchType && matchKeyword;
            });

            if (rowCountEl) rowCountEl.innerText = filtered.length;

            let totalCostSum = 0;
            filtered.forEach(d => {
                totalCostSum += (parseMoney(d.cost) * (parseInt(d.qty) || 0));
            });
            if (totalCostEl) totalCostEl.innerText = isPrivacyMode ? '***' : formatMoney(totalCostSum);

            const desktopHeader = document.getElementById('desktop-table-header');
            if (desktopHeader) {
                if (isPrivacyMode) {
                    desktopHeader.innerHTML = `
                        <th class="py-3 px-4 text-left">TÊN MÁY</th>
                        <th class="py-3 px-3">LINH KIỆN</th>
                        <th class="py-3 px-3">KIỂU</th>
                        <th class="py-3 px-3">GIÁ BÁN</th>
                        <th class="py-3 px-3">SL</th>
                        <th class="py-3 px-3">THAO TÁC</th>
                    `;
                } else {
                    desktopHeader.innerHTML = `
                        <th class="py-3 px-4 text-left">TÊN MÁY</th>
                        <th class="py-3 px-3">LINH KIỆN</th>
                        <th class="py-3 px-3">KIỂU</th>
                        <th class="py-3 px-3">GIÁ BÁN</th>
                        <th class="py-3 px-3">SL</th>
                        <th class="py-3 px-3">THAO TÁC</th>
                        <th class="py-3 px-3">GIÁ NHẬP</th>
                        <th class="py-3 px-3">LÃI</th>
                    `;
                }
            }

            if (filtered.length === 0) {
                if (tbody) tbody.innerHTML = '';
                if (mobileList) mobileList.innerHTML = '';
                if (emptyState) emptyState.classList.remove('hidden');
                return;
            }

            if (emptyState) emptyState.classList.add('hidden');

            if (tbody) {
                tbody.innerHTML = filtered.map((d, index) => {
                    const realIndex = devices.indexOf(d);
                    const qtyVal = parseInt(d.qty) || 0;
                    const priceFormatted = formatMoney(d.price);
                    const costFormatted = formatMoney(d.cost);
                    const profitVal = (parseMoney(d.price) - parseMoney(d.cost)) * qtyVal;
                    const profitFormatted = formatMoney(profitVal);
                    const formattedNameHtml = renderDeviceNames(d.name, d.color, false);

                    const zeroQtyClass = qtyVal === 0 ? 'yellow-pulse-row' : 'row-hover';

                    if (isPrivacyMode) {
                        return `
                            <tr class="${zeroQtyClass} transition">
                                <td class="py-3 px-4 text-left">${formattedNameHtml}</td>
                                <td class="py-3 px-3 font-semibold text-emerald-400">${d.part}</td>
                                <td class="py-3 px-3 text-indigo-300 font-medium">${d.type || '---'}</td>
                                <td class="py-3 px-3 font-bold text-pink-500">${priceFormatted}</td>
                                <td class="py-3 px-3 font-bold ${qtyVal === 0 ? 'text-red-500 font-extrabold' : 'text-amber-400'}">${d.qty}</td>
                                <td class="py-3 px-3">
                                    <div class="flex items-center justify-center gap-1.5">
                                        <button onclick="editDevice(${realIndex})" class="w-7 h-7 bg-blue-600 hover:bg-blue-500 text-white rounded-lg transition flex items-center justify-center shadow" title="SỬA"><i class="fa-solid fa-pen text-xs"></i></button>
                                        <button onclick="duplicateDevice(${realIndex})" class="w-7 h-7 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg transition flex items-center justify-center shadow" title="NHÂN BẢN"><i class="fa-solid fa-copy text-xs"></i></button>
                                        <button onclick="deleteDevice(${realIndex})" class="w-7 h-7 bg-red-600 hover:bg-red-500 text-white rounded-lg transition flex items-center justify-center shadow" title="XÓA"><i class="fa-solid fa-trash text-xs"></i></button>
                                    </div>
                                </td>
                            </tr>
                        `;
                    }

                    return `
                        <tr class="${zeroQtyClass} transition">
                            <td class="py-3 px-4 text-left">${formattedNameHtml}</td>
                            <td class="py-3 px-3 font-semibold text-emerald-400">${d.part}</td>
                            <td class="py-3 px-3 text-indigo-300 font-medium">${d.type || '---'}</td>
                            <td class="py-3 px-3 font-bold text-pink-500">${priceFormatted}</td>
                            <td class="py-3 px-3 font-bold ${qtyVal === 0 ? 'text-red-500 font-extrabold' : 'text-amber-400'}">${d.qty}</td>
                            <td class="py-3 px-3">
                                <div class="flex items-center justify-center gap-1.5">
                                    <button onclick="editDevice(${realIndex})" class="w-7 h-7 bg-blue-600 hover:bg-blue-500 text-white rounded-lg transition flex items-center justify-center shadow" title="SỬA"><i class="fa-solid fa-pen text-xs"></i></button>
                                    <button onclick="duplicateDevice(${realIndex})" class="w-7 h-7 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg transition flex items-center justify-center shadow" title="NHÂN BẢN"><i class="fa-solid fa-copy text-xs"></i></button>
                                    <button onclick="deleteDevice(${realIndex})" class="w-7 h-7 bg-red-600 hover:bg-red-500 text-white rounded-lg transition flex items-center justify-center shadow" title="XÓA"><i class="fa-solid fa-trash text-xs"></i></button>
                                </div>
                            </td>
                            <td class="py-3 px-3 font-medium text-gray-300">${costFormatted}</td>
                            <td class="py-3 px-3 font-bold text-emerald-400">${profitFormatted}</td>
                        </tr>
                    `;
                }).join('');
            }

            // HIỂN THỊ MOBILE: CÂN BẰNG KHOẢNG CÁCH CHO TAB IPHONE
            if (mobileList) {
                mobileList.innerHTML = filtered.map((d) => {
                    const qtyVal = parseInt(d.qty) || 0;
                    const priceFormatted = formatMoney(d.price);
                    const formattedNameHtml = renderDeviceNames(d.name, d.color, true);

                    const zeroQtyClassMobile = qtyVal === 0 ? 'yellow-pulse-row px-2 rounded-xl' : '';

                    if (isIphone) {
                        return `
                            <div class="py-2.5 flex items-center justify-between gap-2 border-b border-gray-800/40 ${zeroQtyClassMobile}">
                                <div class="flex items-center gap-2 min-w-0">
                                    ${formattedNameHtml}
                                    <div class="flex items-center gap-1 text-xs text-gray-400 shrink-0">
                                        <span class="text-emerald-400 font-semibold">${d.part}</span>
                                        ${d.type ? `<span class="text-indigo-300">• ${d.type}</span>` : ''}
                                    </div>
                                </div>
                                <div class="text-right shrink-0 ml-auto">
                                    <div class="text-base font-bold text-pink-500">${priceFormatted}</div>
                                </div>
                            </div>
                        `;
                    }

                    return `
                        <div class="py-2.5 flex items-center justify-between gap-2 border-b border-gray-800/40 ${zeroQtyClassMobile}">
                            <div class="flex items-center gap-2 min-w-0 flex-1">
                                ${formattedNameHtml}
                            </div>
                            <div class="text-right shrink-0">
                                <div class="text-base font-bold text-pink-500">${priceFormatted}</div>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        function handleSearchInput(input) {
            const val = input.value;
            const desktopInput = document.getElementById('search-input-desktop');
            const mobileInput = document.getElementById('search-input-mobile');
            const clearDesktop = document.getElementById('btn-clear-search-desktop');
            const clearMobile = document.getElementById('btn-clear-search-mobile');

            if (desktopInput && desktopInput.value !== val) desktopInput.value = val;
            if (mobileInput && mobileInput.value !== val) mobileInput.value = val;

            if (val) {
                if (clearDesktop) clearDesktop.classList.remove('hidden');
                if (clearMobile) clearMobile.classList.remove('hidden');
            } else {
                if (clearDesktop) clearDesktop.classList.add('hidden');
                if (clearMobile) clearMobile.classList.add('hidden');
            }
            renderTable();
        }

        function clearSearch() {
            const desktopInput = document.getElementById('search-input-desktop');
            const mobileInput = document.getElementById('search-input-mobile');
            if (desktopInput) desktopInput.value = '';
            if (mobileInput) mobileInput.value = '';
            const clearDesktop = document.getElementById('btn-clear-search-desktop');
            const clearMobile = document.getElementById('btn-clear-search-mobile');
            if (clearDesktop) clearDesktop.classList.add('hidden');
            if (clearMobile) clearMobile.classList.add('hidden');
            renderTable();
        }

        function openModal(isEdit = false) {
            document.getElementById('device-modal').classList.remove('hidden');
            document.getElementById('modal-title').innerText = isEdit ? 'SỬA LINH KIỆN' : 'THÊM LINH KIỆN MỚI';
            
            document.getElementById('brand-suggestions').innerHTML = brands.map(b => `<option value="${b}">`).join('');
            document.getElementById('part-suggestions').innerHTML = categories.map(c => `<option value="${c}">`).join('');
            document.getElementById('type-suggestions').innerHTML = types.map(t => `<option value="${t}">`).join('');
            document.getElementById('name-suggestions').innerHTML = names.map(n => `<option value="${n}">`).join('');

            if (!isEdit) {
                document.getElementById('device-index').value = '-1';
                document.getElementById('device-form').reset();
                document.getElementById('device-brand').value = currentBrand;
                document.getElementById('device-part').value = currentCategory;
                document.getElementById('device-type').value = '';
                document.getElementById('device-qty').value = '1';
                document.getElementById('modal-profit-preview').innerText = '0';
            }
        }

        function onModalPartChange() {
            const index = parseInt(document.getElementById('device-index').value);
            if (index === -1) {
                document.getElementById('device-type').value = '';
            }
        }

        function closeModal() {
            document.getElementById('device-modal').classList.add('hidden');
        }

        function adjustQty(amount) {
            const qtyInput = document.getElementById('device-qty');
            let val = parseInt(qtyInput.value) || 0;
            val += amount;
            if (val < 0) val = 0;
            qtyInput.value = val;
            updateModalStats();
        }

        function updateModalStats() {
            const price = parseMoney(document.getElementById('device-price').value);
            const cost = parseMoney(document.getElementById('device-cost').value);
            const qty = parseInt(document.getElementById('device-qty').value) || 0;
            const profit = (price - cost) * qty;
            document.getElementById('modal-profit-preview').innerText = formatMoney(profit);
        }

        document.getElementById('device-price').addEventListener('input', updateModalStats);
        document.getElementById('device-cost').addEventListener('input', updateModalStats);

        function saveDevice(e) {
            e.preventDefault();
            const index = parseInt(document.getElementById('device-index').value);
            const brand = document.getElementById('device-brand').value.trim().toUpperCase();
            const name = document.getElementById('device-name').value.trim().toUpperCase();
            const part = document.getElementById('device-part').value.trim().toUpperCase();
            const type = document.getElementById('device-type').value.trim().toUpperCase();
            const price = document.getElementById('device-price').value.trim();
            const cost = document.getElementById('device-cost').value.trim();
            const qty = parseInt(document.getElementById('device-qty').value) || 0;
            const color = document.getElementById('device-color').value.trim().toUpperCase();

            if (!brands.includes(brand)) brands.push(brand);
            if (!categories.includes(part)) categories.push(part);
            if (type && !types.includes(type)) types.push(type);
            if (name && !names.includes(name)) names.push(name);

            const deviceObj = { brand, name, part, type, price, cost, qty, color };

            if (index === -1) {
                devices.unshift(deviceObj);
            } else {
                devices[index] = deviceObj;
            }

            saveAllToCloud();
            closeModal();
            currentBrand = brand;
            currentCategory = part;
            currentType = type;
            initTabs();
            renderTable();
        }

        function editDevice(index) {
            const d = devices[index];
            document.getElementById('device-index').value = index;
            openModal(true);

            document.getElementById('device-brand').value = d.brand || '';
            document.getElementById('device-name').value = d.name || '';
            document.getElementById('device-part').value = d.part || '';
            document.getElementById('device-type').value = d.type || '';
            document.getElementById('device-price').value = d.price || '';
            document.getElementById('device-cost').value = d.cost || '';
            document.getElementById('device-qty').value = d.qty !== undefined ? d.qty : 1;
            document.getElementById('device-color').value = d.color || '';
            updateModalStats();
        }

        function duplicateDevice(index) {
            const d = devices[index];
            const cloned = { ...d };
            devices.unshift(cloned);
            saveAllToCloud();
            renderTable();
        }

        function deleteDevice(index) {
            if (confirm('BẠN CÓ CHẮC MUỐN XÓA MỤC NÀY KHÔNG?')) {
                devices.splice(index, 1);
                saveAllToCloud();
                renderTable();
            }
        }

        function handleEntity(entityType, action) {
            let listRef, inputId, labelName;
            if (entityType === 'brands') {
                listRef = brands; inputId = 'device-brand'; labelName = 'HÃNG';
            } else if (entityType === 'categories') {
                listRef = categories; inputId = 'device-part'; labelName = 'LINH KIỆN';
            } else if (entityType === 'types') {
                listRef = types; inputId = 'device-type'; labelName = 'KIỂU';
            } else if (entityType === 'names') {
                listRef = names; inputId = 'device-name'; labelName = 'TÊN MÁY';
            }

            const val = document.getElementById(inputId).value.trim().toUpperCase();

            if (action === 'add') {
                if (!val) { alert(`VUI LÒNG NHẬP TÊN ${labelName}!`); return; }
                if (!listRef.includes(val)) {
                    listRef.push(val);
                    saveAllToCloud();
                    alert(`ĐÃ THÊM ${labelName} MỚI THÀNH CÔNG!`);
                    openModal(document.getElementById('device-index').value !== '-1');
                } else {
                    alert(`${labelName} NÀY ĐÃ TỒN TẠI!`);
                }
            } else if (action === 'edit') {
                if (!val) { alert(`VUI LÒNG NHẬP HOẶC CHỌN ${labelName} CẦN SỬA!`); return; }
                const oldVal = prompt(`NHẬP TÊN MỚI THAY THẾ CHO "${val}":`);
                if (oldVal) {
                    const newVal = oldVal.trim().toUpperCase();
                    const idx = listRef.indexOf(val);
                    if (idx !== -1) listRef[idx] = newVal;
                    else listRef.push(newVal);

                    devices.forEach(d => {
                        if (entityType === 'brands' && d.brand === val) d.brand = newVal;
                        if (entityType === 'categories' && d.part === val) d.part = newVal;
                        if (entityType === 'types' && d.type === val) d.type = newVal;
                        if (entityType === 'names' && d.name === val) d.name = newVal;
                    });

                    saveAllToCloud();
                    document.getElementById(inputId).value = newVal;
                    initTabs();
                    renderTable();
                    alert(`ĐÃ CẬP NHẬT THÀNH CÔNG!`);
                }
            } else if (action === 'delete') {
                if (!val) { alert(`VUI LÒNG NHẬP HOẶC CHỌN ${labelName} CẦN XÓA!`); return; }
                if (confirm(`BẠN CÓ CHẮC MUỐN XÓA "${val}" KHỎI DANH SÁCH GỢI Ý?`)) {
                    const idx = listRef.indexOf(val);
                    if (idx !== -1) listRef.splice(idx, 1);
                    saveAllToCloud();
                    document.getElementById(inputId).value = '';
                    initTabs();
                    renderTable();
                    alert(`ĐÃ XÓA THÀNH CÔNG!`);
                }
            }
        }

        window.onload = function() {
            syncFromCloud();
        };
    </script>
</body>
</html>
