<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BÁO GIÁ SỬA CHỮA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- FIREBASE COMPAT SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; font-size: 1.15rem; }
        .card-dark { background-color: #111827; border: 1px solid #1f2937; }
        .row-hover:hover { background-color: rgba(31, 41, 55, 0.5); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        /* Hiệu ứng nhấp nháy nền vàng toàn bộ hàng ngang khi SL = 0 */
        @keyframes yellowRowPulse {
            0%, 100% {
                background-color: rgba(234, 179, 8, 0.35);
                box-shadow: inset 0 0 12px rgba(234, 179, 8, 0.3);
            }
            50% {
                background-color: rgba(234, 179, 8, 0.05);
                box-shadow: none;
            }
        }
        .yellow-pulse-row {
            animation: yellowRowPulse 1.6s ease-in-out infinite;
        }

        /* Thẻ nhãn hết hàng */
        @keyframes yellowBadgePulse {
            0%, 100% {
                background-color: rgba(234, 179, 8, 0.95);
                color: #000000;
            }
            50% {
                background-color: rgba(234, 179, 8, 0.3);
                color: #facc15;
            }
        }
        .yellow-pulse-badge {
            animation: yellowBadgePulse 1.6s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen p-3 md:p-6 uppercase">

    <div class="max-w-7xl mx-auto space-y-4 md:space-y-6 flex flex-col items-center">
        <!-- THANH CÔNG CỤ & THỐNG KÊ -->
        <div class="card-dark p-3 md:p-4 rounded-2xl flex flex-col gap-3 shadow-lg w-full">
            <div class="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-3">
                <div class="flex flex-col gap-2.5 w-full">
                    <!-- TABS HÃNG -->
                    <div class="flex flex-wrap items-center gap-1.5 overflow-x-auto pb-1 xl:pb-0" id="brand-tabs"></div>
                    
                    <!-- DÒNG LỌC LINH KIỆN & CÁC NÚT ĐIỀU KHIỂN BÊN PHẢI -->
                    <div class="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-3 pt-1 border-t border-gray-800/80">
                        <div class="flex flex-wrap items-center gap-1.5 relative">
                            <span class="text-sm font-bold text-gray-400 uppercase mr-1">LINH KIỆN:</span>
                            <div id="main-cat-tabs" class="flex flex-wrap items-center gap-1.5"></div>
                            
                            <!-- NÚT MŨI TÊN SANG PHẢI (XEM THÊM LINH KIỆN) -->
                            <div class="relative">
                                <button onclick="toggleMoreCats(event)" class="px-3 py-2 rounded-xl text-sm font-bold bg-gray-800 border border-gray-700 hover:bg-gray-700 text-white transition flex items-center justify-center" title="XEM THÊM LINH KIỆN">
                                    <i class="fa-solid fa-chevron-right text-white text-xs"></i>
                                </button>
                                <div id="dropdown-more-cats" class="hidden absolute left-0 mt-2 w-52 bg-gray-900 border border-gray-700 rounded-xl shadow-2xl z-50 p-2 flex flex-col gap-1.5">
                                    <div id="sub-cat-list" class="flex flex-col gap-1"></div>
                                    <div class="border-t border-gray-800 pt-1 mt-1">
                                        <button onclick="handleEntity('categories', 'add')" class="w-full text-left px-3 py-2 rounded-xl text-sm font-semibold text-emerald-400 hover:bg-gray-800 transition flex items-center gap-2">
                                            <i class="fa-solid fa-plus-circle"></i> TẠO MỚI LINH KIỆN
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- CÁC NÚT BÊN PHẢI -->
                        <div class="hidden xl:flex items-center gap-1.5 bg-gray-900/90 p-1 rounded-2xl border border-gray-800 overflow-hidden shrink-0">
                            <button onclick="togglePrivacyMode()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-xl text-sm font-medium border border-gray-700 transition flex items-center justify-center w-8 h-8 shrink-0" title="ẨN / HIỆN VỐN & LÃI">
                                <i class="fa-solid fa-eye text-xs" id="privacy-icon"></i>
                            </button>
                            <div id="cloud-status" class="flex w-8 h-8 bg-gray-800 rounded-xl border border-gray-700 items-center justify-center shrink-0" title="Đang kết nối...">
                                <i class="fa-solid fa-circle-notch fa-spin text-amber-400 text-xs"></i>
                            </div>
                            <div class="flex items-center gap-1.5 bg-gray-900 px-2.5 py-1 rounded-xl border border-gray-800 shrink-0">
                                <div>
                                    <div class="text-[10px] text-gray-400 uppercase tracking-wider text-center">VỐN</div>
                                    <div id="total-cost" class="text-xs font-bold text-amber-400 text-center">0</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- DÒNG TÌM KIẾM, NÚT KIỂU VÀ NÚT THÊM MỚI BÊN DƯỚI -->
                    <div class="flex items-center justify-between gap-2 pt-1 border-t border-gray-800/80 relative">
                        <div class="flex items-center gap-2 flex-1">
                            <div class="relative w-64 md:w-80">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-500">
                                    <i class="fa-solid fa-magnifying-glass text-xs"></i>
                                </span>
                                <input type="text" id="search-input" oninput="handleSearchInput()" placeholder="TÌM KIẾM..." 
                                    class="w-full pl-9 pr-10 py-2 bg-gray-900 border border-gray-700 rounded-xl text-sm focus:outline-none focus:border-indigo-500 text-white placeholder-gray-500 uppercase">
                                <button id="btn-clear-search" onclick="clearSearch()" class="hidden absolute inset-y-0 right-0 px-3 flex items-center text-gray-400 hover:text-white transition text-base" title="XÓA TÌM KIẾM">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                            </div>

                            <!-- NÚT LỌC KIỂU -->
                            <div class="relative shrink-0" id="filter-type-container">
                                <button id="btn-type-filter" onclick="toggleTypeFilter(event)" class="px-3.5 py-2 rounded-xl text-sm font-bold bg-gray-900 border border-gray-700 hover:bg-gray-800 text-white transition flex items-center gap-2" title="LỌC KIỂU">
                                    <span id="label-current-type" class="text-red-500 font-bold">KIỂU</span>
                                    <i class="fa-solid fa-chevron-down text-white text-xs transition-transform duration-200" id="type-chevron"></i>
                                </button>
                                <div id="dropdown-types" class="hidden absolute left-0 mt-2 w-44 bg-gray-900 border border-gray-700 rounded-xl shadow-2xl z-50 p-2 flex flex-col gap-1">
                                    <div id="type-menu-list" class="flex flex-col gap-1"></div>
                                </div>
                            </div>

                            <!-- NÚT THÊM MỚI -->
                            <div class="hidden xl:block shrink-0">
                                <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition flex items-center gap-1.5 shadow-lg shadow-indigo-600/35">
                                    <i class="fa-solid fa-plus"></i> THÊM MỚI
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- BẢNG DỮ LIỆU -->
        <div class="card-dark rounded-2xl overflow-hidden shadow-xl w-full">
            <!-- BẢNG DESKTOP -->
            <div class="hidden md:block overflow-x-auto">
                <table class="w-full text-center border-collapse">
                    <thead>
                        <tr id="desktop-table-header" class="bg-indigo-600 text-white text-sm uppercase tracking-wider shadow-sm"></tr>
                    </thead>
                    <tbody id="device-table-body" class="divide-y divide-gray-800/60 text-base"></tbody>
                </table>
            </div>

            <!-- DANH SÁCH MOBILE RÚT GỌN -->
            <div class="md:hidden divide-y divide-gray-800/40 px-2" id="device-mobile-list"></div>

            <div id="empty-state" class="hidden text-center py-12 text-gray-500">
                <i class="fa-solid fa-box-open text-3xl mb-2"></i>
                <p class="text-sm">KHÔNG TÌM THẤY THIẾT BỊ NÀO PHÙ HỢP.</p>
            </div>
        </div>
    </div>

    <!-- MODAL THÊM / SỬA -->
    <div id="device-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-3 hidden">
        <div class="card-dark w-full max-w-xl rounded-2xl p-5 md:p-7 shadow-2xl border border-gray-700 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modal-title" class="text-base md:text-xl font-bold text-pink-500 uppercase">CHỈNH SỬA THIẾT BỊ</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="device-form" onsubmit="saveDevice(event)" class="space-y-3">
                <input type="hidden" id="device-id">

                <div>
                    <label class="block text-sm font-bold text-amber-400 uppercase mb-1">HÃNG</label>
                    <div class="flex items-center gap-2">
                        <input type="text" id="device-brand" required list="brand-suggestions" class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 uppercase">
                        <datalist id="brand-suggestions"></datalist>
                        <div class="flex items-center gap-1.5">
                            <button type="button" onclick="handleEntity('brands', 'add')" class="w-10 h-10 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl transition flex items-center justify-center font-bold text-sm shadow" title="THÊM HÃNG"><i class="fa-solid fa-plus"></i></button>
                            <button type="button" onclick="handleEntity('brands', 'edit')" class="w-10 h-10 bg-blue-600 hover:bg-blue-500 text-white rounded-xl transition flex items-center justify-center font-bold text-sm shadow" title="SỬA HÃNG"><i class="fa-solid fa-pen"></i></button>
                            <button type="button" onclick="handleEntity('brands', 'delete')" class="w-10 h-10 bg-red-600 hover:bg-red-500 text-white rounded-xl transition flex items-center justify-center font-bold text-sm shadow" title="XÓA HÃNG"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-amber-400 uppercase mb-1">TÊN MÁY</label>
                    <div class="flex items-center gap-2">
                        <input type="text" id="device-name" required class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 uppercase" autocomplete="off">
                        <div class="flex items-center gap-1.5">
                            <button type="button" onclick="handleEntity('names', 'add')" class="w-10 h-10 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl transition flex items-center justify-center font-bold text-sm shadow" title="THÊM TÊN MÁY"><i class="fa-solid fa-plus"></i></button>
                            <button type="button" onclick="handleEntity('names', 'edit')" class="w-10 h-10 bg-blue-600 hover:bg-blue-500 text-white rounded-xl transition flex items-center justify-center font-bold text-sm shadow" title="SỬA TÊN MÁY"><i class="fa-solid fa-pen"></i></button>
                            <button type="button" onclick="handleEntity('names', 'delete')" class="w-10 h-10 bg-red-600 hover:bg-red-500 text-white rounded-xl transition flex items-center justify-center font-bold text-sm shadow" title="XÓA TÊN MÁY"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                    <datalist id="name-suggestions"></datalist>
                </div>

                <!-- LINH KIỆN VÀ KIỂU -->
                <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-center">
                    <div class="md:col-span-7">
                        <label class="block text-sm font-bold text-amber-400 uppercase mb-1 text-center">LINH KIỆN</label>
                        <div class="flex items-center gap-1.5">
                            <input type="text" id="device-part" required list="part-suggestions" class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-3 py-2.5 text-sm text-white text-center focus:outline-none focus:border-indigo-500 uppercase">
                            <datalist id="part-suggestions"></datalist>
                            <div class="flex items-center gap-1 shrink-0">
                                <button type="button" onclick="handleEntity('categories', 'add')" class="w-9 h-10 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl transition flex items-center justify-center font-bold text-xs shadow" title="THÊM"><i class="fa-solid fa-plus"></i></button>
                                <button type="button" onclick="handleEntity('categories', 'edit')" class="w-9 h-10 bg-blue-600 hover:bg-blue-500 text-white rounded-xl transition flex items-center justify-center font-bold text-xs shadow" title="SỬA"><i class="fa-solid fa-pen"></i></button>
                                <button type="button" onclick="handleEntity('categories', 'delete')" class="w-9 h-10 bg-red-600 hover:bg-red-500 text-white rounded-xl transition flex items-center justify-center font-bold text-xs shadow" title="XÓA"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    </div>

                    <div class="md:col-span-5">
                        <label class="block text-sm font-bold text-amber-400 uppercase mb-1 text-center">KIỂU</label>
                        <div class="flex items-center gap-1">
                            <input type="text" id="device-type" list="type-suggestions" class="w-16 md:w-20 bg-gray-900 border border-gray-700 rounded-xl px-2 py-2.5 text-sm text-white text-center focus:outline-none focus:border-indigo-500 uppercase">
                            <datalist id="type-suggestions"></datalist>
                            <div class="flex items-center gap-1 shrink-0">
                                <button type="button" onclick="handleEntity('types', 'add')" class="w-9 h-10 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl transition flex items-center justify-center font-bold text-xs shadow" title="THÊM"><i class="fa-solid fa-plus"></i></button>
                                <button type="button" onclick="handleEntity('types', 'edit')" class="w-9 h-10 bg-blue-600 hover:bg-blue-500 text-white rounded-xl transition flex items-center justify-center font-bold text-xs shadow" title="SỬA"><i class="fa-solid fa-pen"></i></button>
                                <button type="button" onclick="handleEntity('types', 'delete')" class="w-9 h-10 bg-red-600 hover:bg-red-500 text-white rounded-xl transition flex items-center justify-center font-bold text-xs shadow" title="XÓA"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-sm font-bold text-amber-400 uppercase mb-1 text-center">GIÁ BÁN</label>
                        <input type="text" id="device-price" required maxlength="6" oninput="formatCurrencyInput(this)" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2.5 text-sm text-white text-center focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-amber-400 uppercase mb-1 text-center">GIÁ NHẬP</label>
                        <input type="text" id="device-cost" required maxlength="6" oninput="formatCurrencyInput(this)" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2.5 text-sm text-white text-center focus:outline-none focus:border-indigo-500">
                    </div>
                </div>

                <div class="flex items-end gap-2 pt-1">
                    <div class="flex flex-col items-center">
                        <label class="block text-sm font-bold text-amber-400 uppercase mb-1 text-center w-full">SL</label>
                        <div class="flex items-center bg-gray-900 border border-gray-700 rounded-xl overflow-hidden p-0.5 h-11">
                            <button type="button" onclick="adjustQty(-1)" class="w-9 h-10 bg-gray-800 text-white font-bold transition flex items-center justify-center rounded-lg"><i class="fa-solid fa-minus text-xs"></i></button>
                            <input type="number" id="device-qty" required value="1" min="0" oninput="updateModalStats()" class="w-10 bg-transparent text-sm font-bold text-white text-center focus:outline-none">
                            <button type="button" onclick="adjustQty(1)" class="w-9 h-10 bg-gray-800 text-white font-bold transition flex items-center justify-center rounded-lg"><i class="fa-solid fa-plus text-xs"></i></button>
                        </div>
                    </div>

                    <div class="flex flex-col items-center">
                        <label class="block text-sm font-bold text-amber-400 uppercase mb-1 text-center w-full">MÀU</label>
                        <input type="text" id="device-color" list="color-suggestions" placeholder="ĐEN / TRẮNG" class="w-28 bg-gray-900 border border-gray-700 rounded-xl px-2 py-2.5 text-sm text-white text-center focus:outline-none focus:border-indigo-500 uppercase h-11">
                        <datalist id="color-suggestions">
                            <option value="ĐEN">
                            <option value="TRẮNG">
                            <option value="ĐỎ">
                            <option value="VÀNG">
                            <option value="XANH">
                        </datalist>
                    </div>

                    <div class="flex-1 flex flex-col items-center min-w-0">
                        <label class="block text-sm font-bold text-amber-400 uppercase mb-1 text-center w-full">LÃI</label>
                        <div class="w-full bg-gray-900/90 border border-gray-800 px-2 rounded-xl h-11 flex items-center justify-center">
                            <div id="modal-profit-preview" class="text-sm font-bold text-emerald-400 leading-none truncate text-center w-full">0</div>
                        </div>
                    </div>

                    <div class="flex items-center gap-1.5 shrink-0">
                        <button type="button" onclick="closeModal()" class="px-4 h-11 rounded-xl text-sm font-semibold bg-gray-800 text-gray-300 hover:bg-gray-700 transition">HỦY</button>
                        <button type="submit" class="px-5 h-11 rounded-xl text-sm font-semibold bg-indigo-600 text-white hover:bg-indigo-500 transition shadow-lg shadow-indigo-600/35 whitespace-nowrap">LƯU</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBLC4dPLEP84yj6vkvf--DM8u_dN9YPJEs",
            authDomain: "bao-gia-sua-chua.firebaseapp.com",
            projectId: "bao-gia-sua-chua",
            storageBucket: "bao-gia-sua-chua.firebasestorage.app",
            messagingSenderId: "775400571262",
            appId: "1:775400571262:web:b264070746f5fbb6fbf32f"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let devices = [];
        let brands = ['IPHONE', 'SAMSUNG', 'OPPO - REALME', 'MI - POCO', 'VIVO', 'KHÁC'];
        let categories = ['MÀN HÌNH', 'PIN', 'KÍNH - C.ỨNG', 'CÁP/BO SẠC'];
        let types = ['ZIN', 'GX', 'ZIN BÓC MÁY', 'ZIN HÃNG', 'OLED', 'LINH KIỆN'];
        let names = [];

        let currentBrand = brands[0] || '', currentCategory = categories[0] || '', currentType = '', isPrivacyMode = false;

        function getFullCategory(partName) {
            if (!partName) return '';
            const upper = partName.toUpperCase();
            if (upper.includes('MÀN HÌNH')) return 'MÀN HÌNH';
            return partName;
        }

        function getColorHex(colorName) {
            if (!colorName) return '';
            const c = colorName.trim().toUpperCase();
            if (c.includes('ĐEN') || c.includes('BLACK')) return '#111827; border: 1px solid #4b5563';
            if (c.includes('TRẮNG') || c.includes('WHITE')) return '#f9fafb';
            if (c.includes('ĐỎ') || c.includes('RED')) return '#ef4444';
            if (c.includes('VÀNG') || c.includes('GOLD') || c.includes('YELLOW')) return '#eab308';
            if (c.includes('XANH') || c.includes('BLUE') || c.includes('GREEN')) return '#3b82f6';
            if (c.includes('HỒNG') || c.includes('PINK')) return '#ec4899';
            if (c.includes('TÍM') || c.includes('PURPLE')) return '#a855f7';
            if (c.includes('XÁM') || c.includes('GRAY') || c.includes('GREY')) return '#6b7280';
            return '#9ca3af';
        }

        function renderDeviceNames(nameStr, colorStr, isMobile = false) {
            if (!nameStr) return '';
            const parts = nameStr.split('-').map(p => p.trim()).filter(Boolean);
            const isIphone = currentBrand.toUpperCase() === 'IPHONE';
            
            const appleIcon = isIphone ? `<i class="fa-brands fa-apple text-pink-500 text-base mr-1.5 align-middle"></i>` : '';

            let colorDotHtml = '';
            if (colorStr && colorStr.trim()) {
                const hexStyle = getColorHex(colorStr);
                colorDotHtml = `<span class="inline-block w-3.5 h-3.5 rounded-full ml-1.5 mr-1 shrink-0 align-middle shadow-sm" style="background-color: ${hexStyle};" title="MÀU: ${colorStr}"></span>`;
            }

            if (isMobile) {
                const namePartsHtml = parts.map((part, index) => {
                    // Nếu là IPHONE thì tên máy màu trắng, hãng khác màu chữ xen kẽ vàng - trắng
                    const textColor = isIphone ? 'text-white' : ((index % 2 === 0) ? 'text-amber-400' : 'text-white');
                    return `<span class="px-1.5 py-0.5 rounded-lg bg-gray-900 border border-gray-800 ${textColor} font-bold text-xs inline-block whitespace-nowrap">${part}</span>`;
                }).join(' ');
                return `<div class="inline-flex items-center flex-wrap">${appleIcon}${namePartsHtml}${colorDotHtml}</div>`;
            }

            const namePartsHtml = parts.map((part, index) => {
                // Nếu là IPHONE thì tên máy màu trắng, hãng khác màu chữ xen kẽ vàng - trắng
                const textColor = isIphone ? 'text-white' : ((index % 2 === 0) ? 'text-amber-400' : 'text-white');
                return `<span class="px-1.5 py-0.5 rounded bg-gray-800/90 border border-gray-700/60 ${textColor} font-extrabold whitespace-nowrap text-lg inline-block m-0.5">${part}</span>`;
            }).join('');

            return `<div class="inline-flex items-center flex-wrap justify-center">${appleIcon}${namePartsHtml}${colorDotHtml}</div>`;
        }

        function syncFromCloud() {
            const statusEl = document.getElementById('cloud-status');
            if(statusEl) {
                statusEl.setAttribute('title', 'Đang đồng bộ...');
                statusEl.innerHTML = `<i class="fa-solid fa-cloud-arrow-up text-emerald-400 text-xs"></i>`;
            }

            db.collection("store_data").doc("main").onSnapshot((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    if (data.devices) devices = data.devices;
                    if (data.brands) brands = data.brands;
                    if (data.categories) categories = data.categories;
                    if (data.types) types = data.types;
                    if (data.names) names = data.names;
                } else {
                    saveAllToCloud();
                }
                if(statusEl) {
                    statusEl.setAttribute('title', 'Online Realtime');
                    statusEl.innerHTML = `<i class="fa-solid fa-cloud text-emerald-400 text-xs"></i>`;
                }
                if (!currentBrand && brands.length) currentBrand = brands[0];
                if (!currentCategory && categories.length) currentCategory = categories[0];
                initTabs();
                renderTable();
            }, (err) => {
                console.error("Lỗi Firestore:", err);
                if(statusEl) {
                    statusEl.setAttribute('title', 'Lỗi quyền Firebase');
                    statusEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-red-400 text-xs"></i>`;
                }
            });
        }

        async function saveAllToCloud() {
            try {
                await db.collection("store_data").doc("main").set({
                    devices, brands, categories, types, names
                });
            } catch (e) {
                console.error("Lỗi lưu Cloud:", e);
            }
        }

        function initTabs() {
            document.getElementById('brand-tabs').innerHTML = brands.map(b => 
                `<button onclick="currentBrand='${b}'; initTabs(); renderTable();" class="px-3.5 py-2 rounded-xl text-sm font-semibold transition uppercase ${b === currentBrand ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/35' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'}">${b === 'KHÁC' ? 'HÃNG KHÁC' : b}</button>`
            ).join('');

            const fixedMainCats = ['MÀN HÌNH', 'PIN'];
            const catHtml = fixedMainCats.map(c => 
                `<button onclick="currentCategory='${c}'; initTabs(); renderTable();" class="px-3.5 py-2 rounded-xl text-sm font-semibold transition uppercase ${c === currentCategory ? 'bg-indigo-500/20 text-indigo-400 border border-indigo-500/30' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'}">${c}</button>`
            ).join('');

            document.getElementById('main-cat-tabs').innerHTML = catHtml;

            const subCats = categories.filter(c => !fixedMainCats.includes(c));
            const subCatHtml = subCats.length ? subCats.map(c => 
                `<button onclick="currentCategory='${c}'; initTabs(); renderTable(); toggleMoreCats(event);" class="w-full text-left px-3.5 py-2 rounded-xl text-sm font-semibold transition uppercase ${c === currentCategory ? 'bg-indigo-500/20 text-indigo-400' : 'text-gray-300 hover:bg-gray-800'}">${c}</button>`
            ).join('') : '<div class="px-3 py-1 text-sm text-gray-500 italic">Chưa có mục khác</div>';

            document.getElementById('sub-cat-list').innerHTML = subCatHtml;

            const isIphone = currentBrand.toUpperCase() === 'IPHONE';
            const filterTypeContainer = document.getElementById('filter-type-container');
            if (filterTypeContainer) {
                filterTypeContainer.style.display = isIphone ? 'block' : 'none';
            }
            if (!isIphone) currentType = '';

            const lblType = document.getElementById('label-current-type');
            if (lblType) {
                if (currentType) {
                    lblType.innerText = currentType;
                    lblType.className = "text-amber-400 font-bold";
                } else {
                    lblType.innerText = "KIỂU";
                    lblType.className = "text-red-500 font-bold";
                }
            }

            const allTypeOption = `<button onclick="selectType('');" class="w-full text-left px-3.5 py-2 rounded-xl text-sm font-semibold transition uppercase ${currentType === '' ? 'bg-indigo-500/20 text-indigo-400' : 'text-gray-300 hover:bg-gray-800'}">-- TẤT CẢ --</button>`;
            const typeOptions = types.map(t => 
                `<button onclick="selectType('${t}');" class="w-full text-left px-3.5 py-2 rounded-xl text-sm font-semibold transition uppercase ${t === currentType ? 'bg-amber-400/20 text-amber-400' : 'text-gray-300 hover:bg-gray-800'}">${t}</button>`
            ).join('');
            
            document.getElementById('type-menu-list').innerHTML = allTypeOption + typeOptions;

            document.getElementById('brand-suggestions').innerHTML = brands.map(b => `<option value="${b}">`).join('');
            document.getElementById('part-suggestions').innerHTML = categories.map(c => `<option value="${c}">`).join('');
            document.getElementById('type-suggestions').innerHTML = types.map(t => `<option value="${t}">`).join('');
            document.getElementById('name-suggestions').innerHTML = names.map(n => `<option value="${n}">`).join('');
        }

        function toggleTypeFilter(e) {
            e.stopPropagation();
            document.getElementById('dropdown-more-cats')?.classList.add('hidden');
            document.getElementById('dropdown-types').classList.toggle('hidden');
        }

        function selectType(t) {
            currentType = t;
            document.getElementById('dropdown-types').classList.add('hidden');
            initTabs();
            renderTable();
        }

        function toggleMoreCats(e) { 
            e.stopPropagation(); 
            document.getElementById('dropdown-types')?.classList.add('hidden');
            document.getElementById('dropdown-more-cats').classList.toggle('hidden'); 
        }

        window.onclick = () => {
            document.getElementById('dropdown-more-cats')?.classList.add('hidden');
            document.getElementById('dropdown-types')?.classList.add('hidden');
        };

        function adjustQty(val) {
            const input = document.getElementById('device-qty');
            input.value = Math.max(0, (Number(input.value) || 0) + val);
            updateModalStats();
        }

        const parseNum = str => Number(String(str).replace(/\D/g, '')) || 0;
        const fmtVal = val => Number(val).toLocaleString('vi-VN');
        const fmtSecret = val => isPrivacyMode ? '***' : fmtVal(val);

        function formatCurrencyInput(input) {
            let digits = String(input.value).replace(/\D/g, '').slice(0, 5);
            input.value = digits ? Number(digits).toLocaleString('vi-VN') : '';
            updateModalStats();
        }

        function updateModalStats() {
            const p = parseNum(document.getElementById('device-price').value);
            const c = parseNum(document.getElementById('device-cost').value);
            document.getElementById('modal-profit-preview').innerText = fmtVal(p - c);
        }

        function openModal() {
            document.getElementById('modal-title').innerText = "THÊM THIẾT BỊ MỚI";
            document.getElementById('device-id').value = '';
            document.getElementById('device-form').reset();
            document.getElementById('device-qty').value = '1';
            document.getElementById('device-color').value = '';
            document.getElementById('device-brand').value = currentBrand;
            document.getElementById('device-part').value = currentCategory;
            document.getElementById('device-modal').classList.remove('hidden');
            updateModalStats();
        }

        function closeModal() {
            document.getElementById('device-modal').classList.add('hidden');
        }

        function editDevice(id) {
            const item = devices.find(d => d.id === id);
            if (!item) return;
            document.getElementById('modal-title').innerText = "CHỈNH SỬA THIẾT BỊ";
            document.getElementById('device-id').value = item.id;
            document.getElementById('device-brand').value = item.brand;
            document.getElementById('device-name').value = item.name;
            document.getElementById('device-part').value = item.part;
            document.getElementById('device-type').value = item.type;
            document.getElementById('device-price').value = fmtVal(item.price);
            document.getElementById('device-cost').value = fmtVal(item.cost);
            document.getElementById('device-qty').value = item.qty;
            document.getElementById('device-color').value = item.color || '';
            document.getElementById('device-modal').classList.remove('hidden');
            updateModalStats();
        }

        function cloneDevice(id) {
            const item = devices.find(d => d.id === id);
            if (!item) return;
            document.getElementById('modal-title').innerText = "NHÂN BẢN THIẾT BỊ MỚI";
            document.getElementById('device-id').value = '';
            document.getElementById('device-brand').value = item.brand;
            document.getElementById('device-name').value = item.name;
            document.getElementById('device-part').value = item.part;
            document.getElementById('device-type').value = item.type || '';
            document.getElementById('device-price').value = fmtVal(item.price);
            document.getElementById('device-cost').value = fmtVal(item.cost);
            document.getElementById('device-qty').value = item.qty;
            document.getElementById('device-color').value = item.color || '';
            document.getElementById('device-modal').classList.remove('hidden');
            updateModalStats();
        }

        function saveDevice(e) {
            e.preventDefault();
            const id = document.getElementById('device-id').value;
            const brand = document.getElementById('device-brand').value.trim().toUpperCase();
            const name = document.getElementById('device-name').value.trim().toUpperCase();
            const part = document.getElementById('device-part').value.trim().toUpperCase();
            const type = document.getElementById('device-type').value.trim().toUpperCase();
            const price = parseNum(document.getElementById('device-price').value);
            const cost = parseNum(document.getElementById('device-cost').value);
            const qty = Number(document.getElementById('device-qty').value) || 0;
            const color = document.getElementById('device-color').value.trim().toUpperCase();

            if (!brand || !name || !part) return;

            if (id) {
                const index = devices.findIndex(d => d.id == id);
                if (index !== -1) {
                    devices[index] = { id: Number(id), brand, name, part, type, price, cost, qty, color };
                }
            } else {
                const newId = devices.length > 0 ? Math.max(...devices.map(d => d.id)) + 1 : 1;
                devices.push({ id: newId, brand, name, part, type, price, cost, qty, color });
            }

            if (!brands.includes(brand)) brands.push(brand);
            if (!categories.includes(part)) categories.push(part);
            if (type && !types.includes(type)) types.push(type);
            if (!names.includes(name)) names.push(name);

            saveAllToCloud();
            closeModal();
            initTabs();
            renderTable();
        }

        function deleteDevice(id) {
            if (confirm("BẠN CÓ CHẮC MUỐN XÓA THIẾT BỊ NÀY KHÔNG?")) {
                devices = devices.filter(d => d.id !== id);
                saveAllToCloud();
                renderTable();
            }
        }

        function togglePrivacyMode() {
            isPrivacyMode = !isPrivacyMode;
            const icon = document.getElementById('privacy-icon');
            if (icon) {
                icon.className = isPrivacyMode ? "fa-solid fa-eye-slash text-xs text-amber-400" : "fa-solid fa-eye text-xs";
            }
            renderTable();
        }

        function handleSearchInput() {
            const input = document.getElementById('search-input');
            const clearBtn = document.getElementById('btn-clear-search');
            if (input.value.trim().length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
            renderTable();
        }

        function clearSearch() {
            const input = document.getElementById('search-input');
            input.value = '';
            document.getElementById('btn-clear-search').classList.add('hidden');
            renderTable();
        }

        function handleEntity(entityType, action) {
            let listRef, titleName;
            if (entityType === 'brands') { listRef = brands; titleName = "HÃNG"; }
            else if (entityType === 'categories') { listRef = categories; titleName = "LINH KIỆN"; }
            else if (entityType === 'types') { listRef = types; titleName = "KIỂU"; }
            else if (entityType === 'names') { listRef = names; titleName = "TÊN MÁY"; }

            if (action === 'add') {
                let val = prompt(`NHẬP TÊN ${titleName} MỚI:`).trim().toUpperCase();
                if (val && !listRef.includes(val)) {
                    listRef.push(val);
                    saveAllToCloud();
                    initTabs();
                    renderTable();
                }
            } else if (action === 'edit') {
                let oldVal = prompt(`NHẬP TÊN ${titleName} CẦN SỬA:`).trim().toUpperCase();
                let index = listRef.indexOf(oldVal);
                if (index !== -1) {
                    let newVal = prompt(`NHẬP TÊN MỚI CHO ${oldVal}:`).trim().toUpperCase();
                    if (newVal) {
                        listRef[index] = newVal;
                        saveAllToCloud();
                        initTabs();
                        renderTable();
                    }
                } else {
                    alert(`KHÔNG TÌM THẤY ${titleName} NÀY!`);
                }
            } else if (action === 'delete') {
                let val = prompt(`NHẬP TÊN ${titleName} CẦN XÓA:`).trim().toUpperCase();
                let index = listRef.indexOf(val);
                if (index !== -1) {
                    if (confirm(`BẠN CÓ CHẮC MUỐN XÓA ${val}?`)) {
                        listRef.splice(index, 1);
                        saveAllToCloud();
                        initTabs();
                        renderTable();
                    }
                } else {
                    alert(`KHÔNG TÌM THẤY ${titleName} NÀY!`);
                }
            }
        }

        function renderTable() {
            const searchVal = document.getElementById('search-input').value.trim().toUpperCase();
            const isIphone = currentBrand.toUpperCase() === 'IPHONE';

            let filtered = devices.filter(d => {
                const matchBrand = d.brand.toUpperCase() === currentBrand.toUpperCase();
                const matchCat = getFullCategory(d.part) === getFullCategory(currentCategory);
                const matchType = !isIphone || !currentType || (d.type && d.type.toUpperCase() === currentType.toUpperCase());
                
                const matchSearch = !searchVal || 
                    d.name.toUpperCase().includes(searchVal) || 
                    d.part.toUpperCase().includes(searchVal) || 
                    (d.type && d.type.toUpperCase().includes(searchVal)) ||
                    (d.color && d.color.toUpperCase().includes(searchVal));

                return matchBrand && matchCat && matchType && matchSearch;
            });

            // SẮP XẾP DANH SÁCH THEO TÊN MÁY TỪ A ĐẾN Z
            filtered.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'vi', { numeric: true, sensitivity: 'base' }));

            const emptyState = document.getElementById('empty-state');
            const desktopHeader = document.getElementById('desktop-table-header');
            const tbody = document.getElementById('device-table-body');
            const mobileList = document.getElementById('device-mobile-list');

            if (filtered.length === 0) {
                desktopHeader.innerHTML = '';
                tbody.innerHTML = '';
                mobileList.innerHTML = '';
                emptyState.classList.remove('hidden');
                document.getElementById('total-cost').innerText = '0';
                return;
            }

            emptyState.classList.add('hidden');

            let headers = ['TÊN MÁY', 'LINH KIỆN'];
            if (isIphone) headers.push('KIỂU');
            headers.push('GIÁ BÁN', 'SL', 'THAO TÁC', 'GIÁ NHẬP', 'LÃI');
            desktopHeader.innerHTML = `<tr>${headers.map(h => `<th class="py-2 px-1.5">${h}</th>`).join('')}</tr>`;

            let totalCostSum = 0;

            tbody.innerHTML = filtered.map(d => {
                const profit = d.price - d.cost;
                totalCostSum += (d.cost * (d.qty || 1));
                const formattedName = renderDeviceNames(d.name, d.color, false);
                
                const isOutOfStock = d.qty === 0 || d.qty === '0';
                const rowClass = isOutOfStock ? 'yellow-pulse-row' : 'row-hover';
                const qtyTextClass = isOutOfStock ? 'text-amber-300 font-extrabold text-base' : 'text-sm font-bold';

                let cols = `<td class="py-2 px-1.5 font-bold">${formattedName}</td>`;
                cols += `<td class="py-2 px-1.5 font-bold text-red-500 text-sm uppercase">${d.part || '-'}</td>`;

                if (isIphone) {
                    cols += `<td class="py-2 px-1.5 font-bold text-amber-400 text-sm">${d.type || '-'}</td>`;
                }
                cols += `
                    <td class="py-2 px-1.5 font-bold text-emerald-400 text-xl">${fmtVal(d.price)}</td>
                    <td class="py-2 px-1.5"><span class="${qtyTextClass}">${d.qty}</span></td>
                    <td class="py-2 px-1.5">
                        <div class="flex items-center justify-center gap-0.5">
                            <button onclick="cloneDevice(${d.id})" class="w-6 h-6 bg-emerald-600/90 hover:bg-emerald-500 text-white rounded transition flex items-center justify-center text-[10px]" title="NHÂN BẢN"><i class="fa-solid fa-copy"></i></button>
                            <button onclick="editDevice(${d.id})" class="w-6 h-6 bg-blue-600/90 hover:bg-blue-500 text-white rounded transition flex items-center justify-center text-[10px]" title="SỬA"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteDevice(${d.id})" class="w-6 h-6 bg-red-600/90 hover:bg-red-500 text-white rounded transition flex items-center justify-center text-[10px]" title="XÓA"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </td>
                    <td class="py-2 px-1.5 font-bold text-pink-500 text-xs">${fmtSecret(d.cost)}</td>
                    <td class="py-2 px-1.5 font-bold text-cyan-400 text-xs">${fmtSecret(profit)}</td>
                `;
                return `<tr class="${rowClass} transition">${cols}</tr>`;
            }).join('');

            mobileList.innerHTML = filtered.map(d => {
                const profit = d.price - d.cost;
                const formattedNameMobile = renderDeviceNames(d.name, d.color, true);
                const isOutOfStock = d.qty === 0 || d.qty === '0';
                const rowClassMobile = isOutOfStock ? 'yellow-pulse-row rounded-xl p-2 my-1' : 'py-3';
                const qtyStyleMobile = isOutOfStock ? 'text-amber-300 font-extrabold' : 'text-gray-300 font-bold';

                return `
                    <div class="flex items-center justify-between gap-2 ${rowClassMobile}">
                        <div class="flex flex-col gap-1 min-w-0">
                            <div class="flex items-center gap-1.5 flex-wrap">
                                ${formattedNameMobile}
                                <span class="text-xs font-bold text-red-500 bg-gray-900 px-1.5 py-0.5 rounded border border-gray-800">${d.part}</span>
                                ${isIphone && d.type ? `<span class="text-xs font-bold text-amber-400 bg-gray-900 px-1.5 py-0.5 rounded border border-gray-800">${d.type}</span>` : ''}
                                ${isOutOfStock ? `<span class="text-[10px] yellow-pulse-badge px-1.5 py-0.2 rounded font-extrabold">HẾT HÀNG</span>` : ''}
                            </div>
                            <div class="flex items-center gap-3 text-sm">
                                <span class="text-emerald-400 font-bold text-lg">GIÁ: ${fmtVal(d.price)}</span>
                                <span class="${qtyStyleMobile}">SL: ${d.qty}</span>
                                <span class="text-pink-500 font-bold text-xs">GIÁ NHẬP: ${fmtSecret(d.cost)}</span>
                                <span class="text-cyan-400 font-bold text-xs">LÃI: ${fmtSecret(profit)}</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-1 shrink-0">
                            <button onclick="cloneDevice(${d.id})" class="w-7 h-7 bg-emerald-600 text-white rounded flex items-center justify-center text-xs" title="NHÂN BẢN"><i class="fa-solid fa-copy"></i></button>
                            <button onclick="editDevice(${d.id})" class="w-7 h-7 bg-blue-600 text-white rounded flex items-center justify-center text-xs" title="SỬA"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteDevice(${d.id})" class="w-7 h-7 bg-red-600 text-white rounded flex items-center justify-center text-xs" title="XÓA"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('total-cost').innerText = fmtSecret(totalCostSum);
        }

        syncFromCloud();
    </script>
</body>
</html>
